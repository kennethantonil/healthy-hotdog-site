<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS — Desktop</title>
<meta name="theme-color" content="#0b5ed7">
<link rel="manifest" href="manifest.json" crossorigin>
<style>
/* (styles identical to the original POS with small additions for the new UI) */
:root{ --bg:#f4f6f8; --card:#fff; --accent:#0b5ed7; --ok:#198754; --danger:#dc3545; --muted:#6c757d; --shadow: 0 6px 18px rgba(15,23,42,0.08); }
*{box-sizing:border-box;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
body{margin:0;background:var(--bg);color:#0e1724}
header{background:linear-gradient(90deg,#0b5ed7,#0a66c2);color:white;padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:16px}
.container{max-width:1200px;margin:12px auto;padding:10px}
.grid{display:grid;grid-template-columns:1fr 420px;gap:12px}
.card{background:var(--card);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;margin-bottom:8px}
.toolbar input, .toolbar select, .toolbar button{padding:8px;border-radius:8px;border:1px solid #e6eef8}
.inventory-list{max-height:300px;overflow:auto;border:1px solid #eef3fb;border-radius:8px;padding:6px}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:6px}
.item-row:nth-child(odd){background:#fbfdff}
.cart{display:flex;flex-direction:column;gap:8px}
.cart-items{max-height:340px;overflow:auto;border:1px dashed #e5eefc;padding:6px;border-radius:8px}
.cart-row{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #f0f5fa}
.cart-row:last-child{border-bottom:none}
.muted{color:var(--muted)}
.summary{display:flex;flex-direction:column;gap:8px}
.summary .row{display:flex;justify-content:space-between;align-items:center}
.big{font-size:22px;font-weight:800}
.controls{display:flex;flex-direction:column;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{width:760px;max-width:96%;background:white;padding:12px;border-radius:10px}
.btn{background:var(--accent);color:white;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
.btn.secondary{background:#eef4ff;color:var(--accent)}
.btn.warn{background:var(--danger)}
input[type='number']{width:100px}
.flex{display:flex;align-items:center;gap:8px}
.right{text-align:right}
.small{font-size:13px}
footer{max-width:1200px;margin:12px auto;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:980px){.grid{grid-template-columns:1fr}.right-col{order:2}}


/* Receipt template editor */
.template-area{display:flex;gap:8px}
.template-preview{border:1px solid #eef3fb;padding:12px;border-radius:8px;background:#fff;min-width:280px}
.logo-preview{width:120px;height:80px;border:1px dashed #dfeaf7;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header>
<div style="width:36px;height:36px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;color:#0b5ed7;font-weight:800">POS</div>
</html>
