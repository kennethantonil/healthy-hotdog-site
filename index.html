<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PH News Lower Third</title>
<style>
    body { margin:0; background:transparent; font-family:Arial, sans-serif; }

    .controls {
        position: absolute; top: 10px; right: 10px;
        background:rgba(255,255,255,0.95);
        padding:12px; border-radius:6px;
        width: 260px; font-size:14px;
        z-index: 99;
    }
    .controls h3 { margin:4px 0 8px; }

    label { font-weight:bold; display:block; margin-top:8px; }
    input,textarea {
        width:100%; margin-top:4px; padding:5px;
        border-radius:5px;
        border:1px solid #999;
    }
    button {
        width:100%; margin-top:10px; padding:8px;
        border:none; border-radius:6px;
        font-weight:bold; cursor:pointer;
    }

    /* --- LOWER THIRD DESIGN --- */
    .lower-third {
        position:absolute;
        bottom:60px; left:30px;
        display:flex; align-items:center;
    }

    .logo {
        width:110px; height:110px;
        background:white;
        border-radius:12px;
        border:4px solid maroon;
        font-size:22px; font-weight:bold;
        display:flex; justify-content:center; align-items:center;
        margin-right:18px;
    }

    .panel {
        display:flex; flex-direction:column;
    }

    .headline-container {
        background:rgba(128,0,0,0.85);
        padding:18px 28px;
        border-radius:18px;
        width:1100px; /* 🔥 LONGER BANNER */
        color:white;
        font-size:36px; font-weight:900;
        text-transform:uppercase;
        box-shadow:0 0 25px rgba(128,0,0,0.9);
        white-space:nowrap;
    }

    /* 🔥 TICKER Continuous Loop */
    .ticker-container {
        background:rgba(255,255,255,0.17);
        backdrop-filter:blur(12px);
        margin-top:8px;
        height:50px;
        overflow:hidden;
        border-radius:18px;
        width:1100px;
        border:2px solid rgba(255,255,255,0.4);
        position:relative;
    }

    .ticker {
        position:absolute;
        width:100%;
        animation:tickerMove 12s linear infinite; /* ✅ continuous */
    }

    @keyframes tickerMove {
        0% { transform:translateY(0); }
        100% { transform:translateY(-100%); } /* loops full set */
    }

    .ticker div {
        color:white;
        font-size:22px;
        padding:10px 16px;
        font-weight:600;
        height:50px; /* match container */
        display:flex;
        align-items:center;
    }
</style>
</head>
<body>

<!-- CONTROL PANEL -->
<div class="controls">
    <h3>OBS Controls</h3>

    <label>Headline</label>
    <input id="headlineInput" value="BREAKING HEADLINE">

    <label>Ticker Lines (each line new row)</label>
    <textarea id="tickerInput" rows="4">Update 1\nUpdate 2\nUpdate 3\nUpdate 4</textarea>

    <label>Logo Text</label>
    <input id="logoInput" value="LOGO">

    <label>Accent Color</label>
    <input id="colorInput" type="color" value="#800000">

    <label>Corner Radius</label>
    <input id="radiusInput" type="number" min="0" max="50" value="18">

    <button onclick="applyChanges()">Apply Changes ✅</button>
</div>

<!-- LOWER THIRD -->
<div class="lower-third">
    <div class="logo" id="logoBox">LOGO</div>

    <div class="panel">
        <div class="headline-container" id="headlineBox">BREAKING HEADLINE</div>

        <div class="ticker-container">
            <div class="ticker" id="tickerBox">
                <div>Update 1</div>
                <div>Update 2</div>
                <div>Update 3</div>
                <div>Update 4</div>
            </div>
        </div>
    </div>
</div>

<script>
function applyChanges() {
    const headline = document.getElementById("headlineInput").value;
    const lines = document.getElementById("tickerInput").value.split("\\n");
    const logo = document.getElementById("logoInput").value;
    const color = document.getElementById("colorInput").value;
    const radius = document.getElementById("radiusInput").value + "px";

    document.getElementById("headlineBox").innerText = headline;
    document.getElementById("logoBox").innerText = logo;

    let tickerHTML = "";
    lines.forEach(line => {
        tickerHTML += `<div>${line}</div>`;
    });
    document.getElementById("tickerBox").innerHTML = tickerHTML;

    document.querySelector(".headline-container").style.background = color;
    document.querySelector(".headline-container").style.boxShadow = `0 0 25px ${color}`;
    document.querySelector(".headline-container").style.borderRadius = radius;
    document.querySelector(".ticker-container").style.borderRadius = radius;
}
</script>

</body>
</html>
