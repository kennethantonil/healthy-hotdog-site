<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopNow - Ultimate Bootstrap E-Commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body.dark-mode { background-color: #121212; color: #eee; }
    .dark-mode .card { background-color: #1e1e1e; color: #fff; }
    .floating-chat, .floating-cart {
      position: fixed; bottom: 20px; width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s;
    }
    .floating-chat { right: 20px; background: linear-gradient(135deg, #00b4ff, #007bff); }
    .floating-cart { right: 80px; background: linear-gradient(135deg, #28a745, #218838); }
    .floating-chat:hover, .floating-cart:hover { transform: scale(1.1); }
    .blink-badge {
      position: absolute; top: -5px; right: -5px; background: red; color: #fff;
      border-radius: 50%; width: 15px; height: 15px; font-size: 10px; display: flex; align-items: center; justify-content: center;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0; } }
    .fade-in-slide { animation: fadeSlide 0.5s ease forwards; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .product-img { width: 100%; height: 150px; object-fit: cover; border-radius: 15px; transition: transform 0.3s; }
    .product-img:hover { transform: scale(1.05); }
    .logo-img { height: 60px; margin-right: 0; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded-bottom">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="https://i.imgur.com/HpWzUcE.png" alt="Logo" class="logo-img">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('shop')">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('cart')">Cart</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('live')">Live</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="toggleDarkMode()">🌓</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div id="shopSection" class="fade-in-slide">
    <input type="text" class="form-control mb-3" placeholder="Search Products..." onkeyup="filterProducts(this.value)">
    <div class="row" id="productList"></div>
  </div>

  <div id="cartSection" style="display:none;" class="fade-in-slide">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <div class="mt-3">
      <h5>Total: ₱<span id="cartTotal">0</span></h5>
      <button class="btn btn-success" onclick="confirmCheckout()">Checkout</button>
    </div>
  </div>

  <div id="liveSection" style="display:none;" class="fade-in-slide">
    <h3>Live Selling</h3>
    <button class="btn btn-primary mb-2" onclick="toggleLiveMode()">Toggle Live/Replay</button>
    <video id="liveVideo" class="w-100 rounded" controls autoplay muted>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
  </div>
</div>

<div class="floating-chat" onclick="window.location.href='https://m.me/YOUR_PAGE_USERNAME'">
  💬<div class="blink-badge">!</div>
</div>
<div class="floating-cart" onclick="showSection('cart')">
  🛒
</div>

<div class="modal fade" id="orderSummaryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Your Order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="orderSummaryBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="checkout()">Confirm & Checkout</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Success!</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">Your order has been sent successfully!</div>
    </div>
  </div>
</div>

<script>
  const products = [
    { name: 'Hotdog Special', price: 100, img: 'https://via.placeholder.com/200x150?text=Hotdog' },
    { name: 'Beef Burger', price: 150, img: 'https://via.placeholder.com/200x150?text=Burger' },
    { name: 'Chicken Nuggets', price: 80, img: 'https://via.placeholder.com/200x150?text=Nuggets' },
    { name: 'Iced Tea', price: 50, img: 'https://via.placeholder.com/200x150?text=Iced+Tea' },
    { name: 'Soda', price: 40, img: 'https://via.placeholder.com/200x150?text=Soda' }
  ];
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let darkMode = localStorage.getItem('darkMode') === 'true';
  const productList = document.getElementById('productList');

  function renderProducts(filter = '') {
    productList.innerHTML = '';
    products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase())).forEach(p => {
      productList.innerHTML += `
        <div class="col-md-4 mb-3">
          <div class="card p-3 rounded-4 shadow">
            <img src="${p.img}" class="product-img mb-2">
            <h5>${p.name}</h5>
            <p>₱${p.price}</p>
            <div class="input-group">
              <input type="number" value="1" min="1" class="form-control rounded-start">
              <button class="btn btn-primary rounded-end" onclick="addToCart('${p.name}', ${p.price}, this)">Add</button>
            </div>
          </div>
        </div>`;
    });
  }

  function addToCart(name, price, btn) {
    const qty = parseInt(btn.parentElement.querySelector('input').value);
    cart.push({ name, price, qty });
    localStorage.setItem('cart', JSON.stringify(cart));
    alert('Added to Cart!');
  }

  function loadCart() {
    const cartItems = document.getElementById('cartItems');
    const cartTotal = document.getElementById('cartTotal');
    cartItems.innerHTML = '';
    let total = 0;
    cart.forEach((item, index) => {
      total += item.price * item.qty;
      cartItems.innerHTML += `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>${item.qty} x ${item.name}</div>
          <div>
            <button class="btn btn-sm btn-outline-secondary" onclick="editQty(${index}, -1)">-</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="editQty(${index}, 1)">+</button>
            <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})">x</button>
          </div>
        </div>`;
    });
    cartTotal.innerText = total;
  }

  function editQty(index, change) {
    cart[index].qty += change;
    if (cart[index].qty <= 0) cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
  }

  function confirmCheckout() {
    if (!cart.length) return alert('Your cart is empty!');
    document.getElementById('orderSummaryBody').innerHTML = cart.map(i => `${i.qty} x ${i.name} = ₱${i.qty * i.price}`).join('<br>');
    new bootstrap.Modal(document.getElementById('orderSummaryModal')).show();
  }

  function checkout() {
    const order = cart.map(i => `${i.qty} x ${i.name}`).join(', ');
    window.location.href = `https://m.me/YOUR_PAGE_USERNAME?ref=${encodeURIComponent(order)}`;
    new bootstrap.Modal(document.getElementById('successModal')).show();
  }

  function filterProducts(value) { renderProducts(value); }

  function toggleDarkMode() {
    darkMode = !darkMode;
    localStorage.setItem('darkMode', darkMode);
    document.body.classList.toggle('dark-mode', darkMode);
  }

  function toggleLiveMode() {
    const video = document.getElementById('liveVideo');
    video.src = video.src.includes('mov_bbb') ? 'https://www.w3schools.com/html/movie.mp4' : 'https://www.w3schools.com/html/mov_bbb.mp4';
  }

  function showSection(section) {
    document.getElementById('shopSection').style.display = 'none';
    document.getElementById('cartSection').style.display = 'none';
    document.getElementById('liveSection').style.display = 'none';
    document.getElementById(section + 'Section').style.display = 'block';
    if (section === 'cart') loadCart();
  }

  renderProducts();
  if (darkMode) document.body.classList.add('dark-mode');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
