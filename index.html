<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frozen White</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fadeIn 1s ease-in-out forwards; opacity: 0; }
    @keyframes fadeIn { to { opacity: 1; } }
    .cart { right: -100%; transition: right 0.3s ease; }
    .cart.cart-open { right: 0; }
    .live-overlay-button {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 0.25rem;
      font-weight: bold;
      border: 1px solid rgba(0,0,0,0.2);
      box-shadow: none;
    }
  </style>
</head>
<body class="bg-white text-gray-800 font-sans">

<header class="bg-red-500 text-white p-4 flex justify-between items-center">
  <h1 class="text-lg sm:text-2xl font-bold">FROZEN WHITE</h1>
  <button onclick="toggleCart()" class="relative">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 7H18M7 13H5.4M6 21a1 1 0 100-2 1 1 0 000 2zm12 0a1 1 0 100-2 1 1 0 000 2z" />
    </svg>
    <span id="cart-count" class="bg-white text-red-500 text-xs rounded-full px-1 absolute -top-2 -right-2">0</span>
  </button>
</header>

<div id="cart-message" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded shadow z-50 transition duration-300">
  ✅ Added to cart!
</div>

<main>
  <section id="home-section" class="pb-24">
    <div class="p-4 flex flex-col sm:flex-row gap-2">
      <input id="search-bar" type="text" placeholder="Search Products..." class="border p-2 rounded flex-1" oninput="searchProducts()">
      <select onchange="filterCategory(this.value)" class="border p-2 rounded">
        <option value="All">All</option>
        <option value="Best Sellers">Best Sellers</option>
        <option value="New">New</option>
        <option value="Discounted">Discounted</option>
      </select>
    </div>
    <section id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 p-4"></section>
  </section>

  <section id="videos-section" class="hidden p-0 m-0 w-full h-screen overflow-hidden relative bg-black flex flex-col">
    <div id="live-container" class="flex-1 flex justify-center items-center"></div>
    <p id="no-live-text" class="text-white text-center p-4">No Live Yet</p>
    <div class="flex justify-around items-center p-2 bg-white bg-opacity-50">
      <button onclick="toggleLiveCart()" class="live-overlay-button px-2 py-1">🛒 Products</button>
      <button onclick="likeLive()" class="live-overlay-button px-2 py-1">❤️ Like</button>
      <button onclick="shareLive()" class="live-overlay-button px-2 py-1">🔗 Share</button>
    </div>
    <div id="live-product-cart" class="hidden bg-white bg-opacity-80 p-2 overflow-y-auto">
      <div id="live-products" class="space-y-2"></div>
    </div>
    <div class="p-2">
      <input type="text" placeholder="Write a comment..." class="w-full p-2 rounded border border-gray-300">
    </div>
  </section>

  <section id="me-section" class="hidden p-4 bg-gray-50 mt-4 rounded shadow"></section>
</main>

<div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40" onclick="toggleCart()"></div>
<aside id="cart" class="cart fixed top-0 w-64 sm:w-80 h-full bg-white shadow-2xl rounded-l-2xl transition-all duration-300 z-50 p-4 flex flex-col"></aside>

<nav class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around items-center p-2 shadow">
  <button onclick="showSection('home-section')" class="flex flex-col items-center text-xs">🏠 Home</button>
  <button onclick="showSection('videos-section'); checkLive()" class="flex flex-col items-center text-xs">📺 Live</button>
  <button onclick="showSection('me-section')" class="flex flex-col items-center text-xs">👤 Me</button>
</nav>

<script>
const products = [
  { name: 'White Hotdog', price: 99, image: 'https://i.imgur.com/gAeCg4G.jpeg', category: 'Best Sellers' },
  { name: 'Cheesy Dog', price: 120, image: 'https://i.imgur.com/QOuh61H.jpeg', category: 'New' },
  { name: 'Healthy Pack', price: 150, image: 'https://i.imgur.com/MDikZOM.jpeg', category: 'Discounted' },
];

let cartItems = [];

function renderProducts(filtered = products) {
  const list = document.getElementById('product-list');
  list.innerHTML = '';
  filtered.forEach((p, index) => {
    const div = document.createElement('div');
    div.className = 'fade-in border rounded shadow p-2';
    div.innerHTML = `
      <img src="${p.image}" alt="${p.name}" class="w-full h-32 object-cover rounded">
      <h3 class="font-bold">${p.name}</h3>
      <p class="text-sm text-gray-600">₱${p.price}</p>
      <div class="flex items-center gap-2 mt-2">
        <button onclick="changeQuantity(${index}, -1)" class="px-2 py-1 bg-gray-200 rounded">-</button>
        <input id="qty-${index}" type="number" value="1" min="1" class="w-12 text-center border rounded">
        <button onclick="changeQuantity(${index}, 1)" class="px-2 py-1 bg-gray-200 rounded">+</button>
        <button onclick="addToCart(${index})" class="bg-red-500 hover:bg-red-600 text-white py-1 px-2 rounded text-sm">Add to Cart</button>
      </div>`;
    list.appendChild(div);
  });
}

function renderLiveProducts() {
  const container = document.getElementById('live-products');
  container.innerHTML = '';
  products.forEach((p, index) => {
    const div = document.createElement('div');
    div.className = 'flex justify-between items-center p-2 border rounded shadow';
    div.innerHTML = `
      <img src="${p.image}" class="w-12 h-12 object-cover rounded">
      <div class="ml-2 flex-1">
        <h4 class="text-sm font-bold">${p.name}</h4>
        <p class="text-xs text-gray-500">₱${p.price}</p>
      </div>
      <button onclick="addToCart(${index})" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Add</button>`;
    container.appendChild(div);
  });
}

function changeQuantity(index, delta) {
  const qtyInput = document.getElementById(`qty-${index}`);
  let qty = parseInt(qtyInput.value);
  qty = isNaN(qty) ? 1 : qty;
  qty = Math.max(1, qty + delta);
  qtyInput.value = qty;
}

function addToCart(index) {
  const qty = parseInt(document.getElementById(`qty-${index}`)?.value) || 1;
  for (let i = 0; i < qty; i++) {
    cartItems.push(products[index]);
  }
  document.getElementById('cart-count').textContent = cartItems.length;
  showAddedMessage();
  updateCart();
}

function showAddedMessage() {
  const msg = document.getElementById('cart-message');
  msg.classList.remove('hidden');
  setTimeout(() => msg.classList.add('hidden'), 2000);
}

function updateCart() {
  const cartContainer = document.getElementById('cart');
  cartContainer.innerHTML = `
    <h2 class="text-xl font-bold mb-4 text-center">🛒 Your Cart</h2>
    <div id="cart-items" class="flex-1 overflow-y-auto space-y-2">
      ${cartItems.map((item, i) => `
        <div class="flex justify-between items-center p-2 border rounded shadow">
          <img src="${item.image}" class="w-12 h-12 object-cover rounded">
          <div class="flex-1 ml-2">
            <h4 class="text-sm font-bold">${item.name}</h4>
            <p class="text-xs text-gray-500">₱${item.price}</p>
          </div>
          <button onclick="removeFromCart(${i})" class="text-red-500 hover:text-red-700">✕</button>
        </div>`).join('')}
    </div>
    <div class="mt-4 font-semibold text-lg text-center">Total: ₱${cartItems.reduce((t, i) => t + i.price, 0)}</div>
    <button onclick="checkoutCart()" class="mt-4 bg-green-500 hover:bg-green-600 text-white py-2 rounded-xl font-bold text-lg shadow">✅ Checkout</button>
  `;
}

function removeFromCart(index) {
  cartItems.splice(index, 1);
  document.getElementById('cart-count').textContent = cartItems.length;
  updateCart();
}

function checkoutCart() {
  alert('✅ Checkout complete!');
  cartItems = [];
  updateCart();
  toggleCart();
}

function filterCategory(cat) {
  if (cat === 'All') renderProducts();
  else renderProducts(products.filter(p => p.category === cat));
}

function searchProducts() {
  const keyword = document.getElementById('search-bar').value.toLowerCase();
  renderProducts(products.filter(p => p.name.toLowerCase().includes(keyword)));
}

function showSection(sectionId) {
  document.querySelectorAll('main > section').forEach(section => section.classList.add('hidden'));
  document.getElementById(sectionId).classList.remove('hidden');
  if (sectionId === 'videos-section') renderLiveProducts();
}

function toggleCart() {
  document.getElementById('cart').classList.toggle('cart-open');
  document.getElementById('cart-overlay').classList.toggle('hidden');
}

function checkLive() {
  const liveContainer = document.getElementById('live-container');
  const noLiveText = document.getElementById('no-live-text');
  const liveAvailable = false;
  if (liveAvailable) {
    noLiveText.classList.add('hidden');
    liveContainer.innerHTML = '<iframe src="https://www.facebook.com/plugins/video.php?href=YOUR_LIVE_VIDEO_URL" class="w-full h-full" frameborder="0" allowfullscreen></iframe>';
  } else {
    noLiveText.classList.remove('hidden');
    liveContainer.innerHTML = '';
  }
}

function toggleLiveCart() {
  document.getElementById('live-product-cart').classList.toggle('hidden');
}

function likeLive() { alert('❤️ Liked!'); }
function shareLive() { alert('🔗 Share this live!'); }

renderProducts();
updateCart();
</script>

</body>
</html>
