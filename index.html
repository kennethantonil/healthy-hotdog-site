<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DZMM Lower Third</title>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#lowerthird {
    position: absolute;
    bottom: 0;
    width: 100%;
}

/* Top card */
#card {
    display: flex;
    width: 100%;
    height: 120px;
    background: #004B95; /* DZMM Blue */
    border-radius: 18px 18px 0 0;
}

/* LEFT SECTION */
#guest {
    flex: 1;
    padding: 12px 20px;
    color: #fff;
}

#g_name {
    font-size: 30px;
    font-weight: bold;
}

#g_title {
    font-size: 22px;
    margin-top: -4px;
    opacity: 0.9;
}

#segment {
    background: #FFC600; /* DZMM Yellow */
    color: #000;
    font-weight: bold;
    padding: 4px 12px;
    margin-top: 8px;
    display: inline-block;
    border-radius: 8px;
    font-size: 20px;
}

/* RIGHT PANEL */
#panel {
    width: 360px;
    background: #D90000; /* DZMM Red */
    border-radius: 18px 0 0 0;
    color: #fff;
    padding: 10px;
    font-size: 20px;
    text-align: center;
}

/* TICKER */
#ticker {
    width: 100%;
    height: 50px;
    background: #FFD000;
    color: #000;
    font-size: 24px;
    font-weight: bold;
    overflow: hidden;
    line-height: 50px;
    white-space: nowrap;
}

#scrolltext {
    display: inline-block;
    padding-left: 100%;
    animation: ticker 18s linear infinite;
}

@keyframes ticker {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-100%); }
}

/* BOTTOM RIGHT BOXES */
#sports {
    position: absolute;
    right: 140px;
    bottom: 55px;
    background: #004B95;
    padding: 6px 10px;
    border-radius: 10px;
    color: #fff;
    font-size: 20px;
}

#clock {
    position: absolute;
    right: 55px;
    bottom: 55px;
    background: #000;
    padding: 6px 10px;
    border-radius: 10px;
    color: #fff;
    font-size: 20px;
}

/* LOGO */
#logo {
    position: absolute;
    right: 10px;
    bottom: 6px;
    width: 45px;
    height: 45px;
    background: #ccc;
    border-radius: 6px;
}
</style>
</head>
<body>

<div id="lowerthird">

    <div id="card">
        <div id="guest">
            <div id="g_name">GUEST NAME HERE</div>
            <div id="g_title">Guest Title / Location</div>
            <div id="segment">ON THE PHONE</div>
        </div>

        <div id="panel">
            DZMM TELE RADYO<br>
            Headline Info Here<br>
            Tue | Nov 5
        </div>
    </div>

    <div id="ticker">
        <div id="scrolltext">BREAKING NEWS: Sample ticker text scrolling continuously — Add your headlines here... • More headlines here... • DZMM TeleRadyo style ticker scrolling nonstop...</div>
    </div>

    <div id="sports">UAAP: Sports Headline Here</div>
    <div id="clock">8:11 AM</div>
    <div id="logo"></div>

</div>

</body>
</html>
