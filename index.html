<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthy White Hotdogs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
    .transition-transform { transition: transform 0.7s ease-in-out; }
    .category-btn.active { font-weight: 600; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); }
  </style>
</head>

<body class="font-inter bg-gray-50 text-gray-800">
  <div class="min-h-screen flex flex-col relative">

    <!-- Header -->
    <header class="bg-white shadow p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center z-10">
      <div class="flex items-center justify-between w-full sm:w-auto">
        <img src="https://drive.google.com/uc?export=view&id=15QKVX9VcJdLq4RtQNDdXhPOjSLF9bAdc" alt="Mommy Sam's Logo" class="h-10 md:h-14 rounded-full">
        <button id="cartToggle" aria-label="Toggle Cart" class="relative ml-auto sm:ml-4">
          <!-- Flat Cart Icon -->
          <svg class="w-6 h-6 text-gray-700" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 3h2l.4 2H21l-3.6 7H7.4L6 6H4.4l-.4-2zM7 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs px-1.5 rounded-full hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Product Categories -->
    <nav class="w-full px-4 py-2 bg-white shadow-sm z-10">
      <div class="flex flex-wrap sm:justify-center gap-2 w-full" id="categoryFilters">
        <span data-category="Chicken Hotdog" class="category-btn px-3 py-2 bg-yellow-100 text-yellow-700 rounded-full text-sm cursor-pointer hover:bg-yellow-200 transition w-full sm:w-auto text-center">Chicken Hotdog</span>
        <span data-category="Fish Hotdog" class="category-btn px-3 py-2 bg-blue-100 text-blue-700 rounded-full text-sm cursor-pointer hover:bg-blue-200 transition w-full sm:w-auto text-center">Fish Hotdog</span>
        <span data-category="Beef Hotdog" class="category-btn px-3 py-2 bg-red-100 text-red-700 rounded-full text-sm cursor-pointer hover:bg-red-200 transition w-full sm:w-auto text-center">Beef Hotdog</span>
        <span data-category="Regular Hotdog" class="category-btn px-3 py-2 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200 transition w-full sm:w-auto text-center">Regular Hotdog</span>
        <span data-category="All" class="category-btn px-3 py-2 bg-green-100 text-green-700 rounded-full text-sm cursor-pointer hover:bg-green-200 transition w-full sm:w-auto text-center">All</span>
      </div>
    </nav>

    <!-- Toast Notification -->
    <div id="notification" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-xl shadow z-50">Added to cart!</div>

    <!-- Carousel -->
    <section class="relative w-full overflow-hidden mt-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 px-4">
      ${[1, 2, 3, 4].map(() => `
        <img src="https://drive.google.com/uc?export=view&id=1G-Z4XpeblWFRtKY9vJ9dUvbeBMyMkbrz" loading="lazy" class="w-full object-cover h-48 sm:h-64 rounded-lg">
      `).join("")}
    </section>

    <!-- Product List -->
    <main class="flex-1 p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="productList"></main>

    <!-- Cart Sidebar -->
    <aside id="cartSidebar" class="hidden fixed top-0 right-0 w-full sm:w-80 max-w-full h-full bg-white shadow-xl p-4 rounded-l-xl z-40 overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Your Cart</h2>
        <button id="closeCart" class="text-gray-500 hover:text-gray-800 text-2xl leading-none">×</button>
      </div>
      <ul id="cartItems" class="space-y-2"></ul>
      <button id="removeAll" class="mt-4 bg-red-500 text-white px-3 py-2 rounded hover:bg-red-600 w-full">Remove All</button>
      <a id="checkoutBtn" href="#" target="_blank" class="mt-2 block text-center bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Checkout via Messenger</a>
    </aside>

    <div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-40 z-30"></div>
  </div>

  <!-- JavaScript -->
  <script>
    const products = [
      { id: 1, name: "Solo Pack", price: 120, description: "Perfect for individual enjoyment.", label: "New", category: "Chicken Hotdog" },
      { id: 2, name: "Family Pack", price: 300, description: "Ideal for sharing with family.", label: "Best Seller", category: "Beef Hotdog" },
      { id: 3, name: "Party Pack", price: 500, description: "For parties and gatherings.", label: "", category: "Fish Hotdog" }
    ];

    const productImage = "https://drive.google.com/uc?export=view&id=1G-Z4XpeblWFRtKY9vJ9dUvbeBMyMkbrz";
    let cart = [];
    let currentCategory = "All";

    function updateCartUI() {
      const cartItems = document.getElementById("cartItems");
      const cartCount = document.getElementById("cartCount");
      cartItems.innerHTML = "";
      let totalItems = 0;

      cart.forEach(item => {
        totalItems += item.quantity;
        cartItems.innerHTML += `
          <li class="flex justify-between items-center">
            <span>${item.name} x${item.quantity}</span>
            <div class="flex gap-1">
              <button onclick="changeQty(${item.id}, -1)" class="bg-gray-200 px-2 rounded text-sm">−</button>
              <button onclick="changeQty(${item.id}, 1)" class="bg-gray-200 px-2 rounded text-sm">+</button>
            </div>
          </li>`;
      });

      cartCount.textContent = totalItems;
      cartCount.classList.toggle("hidden", totalItems === 0);

      const summary = cart.map(item => `${item.name} x${item.quantity}`).join("\n");
      document.getElementById("checkoutBtn").href = `https://www.messenger.com/t/154919933362593?text=${encodeURIComponent(summary)}`;
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) existing.quantity += 1;
      else cart.push({ id, name: product.name, quantity: 1 });
      updateCartUI();
      showNotification();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    function showNotification() {
      const notif = document.getElementById("notification");
      notif.classList.remove("hidden");
      setTimeout(() => notif.classList.add("hidden"), 2000);
    }

    function renderProducts() {
      const container = document.getElementById("productList");
      const filtered = currentCategory === "All" ? products : products.filter(p => p.category === currentCategory);

      container.innerHTML = filtered.map(p => `
        <div class="bg-white shadow rounded-xl p-4 relative">
          <img src="${productImage}" alt="${p.name}" loading="lazy" class="h-40 w-full object-cover rounded-md mb-2">
          ${p.label ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-1 rounded">${p.label}</span>` : ""}
          <h3 class="text-lg font-semibold">${p.name}</h3>
          <p class="text-sm text-gray-500">${p.description}</p>
          <p class="text-xl font-bold mt-2">₱${p.price}</p>
          <div class="flex flex-wrap items-center gap-2 mt-2">
            <button onclick="changeQty(${p.id}, -1)" class="bg-green-500 text-white w-8 h-8 rounded-full text-sm">−</button>
            <button onclick="changeQty(${p.id}, 1)" class="bg-green-500 text-white w-8 h-8 rounded-full text-sm">+</button>
            <button onclick="addToCart(${p.id})" class="ml-auto bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded">Add to Cart</button>
          </div>
        </div>
      `).join("");
    }

    document.querySelectorAll(".category-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderProducts();
      });
    });

    document.getElementById("cartToggle").onclick = () => {
      document.getElementById("cartSidebar").classList.remove("hidden");
      document.getElementById("overlay").classList.remove("hidden");
    };
    document.getElementById("closeCart").onclick = closeCart;
    document.getElementById("overlay").onclick = closeCart;
    document.getElementById("removeAll").onclick = () => {
      cart = [];
      updateCartUI();
    };
    function closeCart() {
      document.getElementById("cartSidebar").classList.add("hidden");
      document.getElementById("overlay").classList.add("hidden");
    }

    renderProducts();
  </script>
</body>

</html>
