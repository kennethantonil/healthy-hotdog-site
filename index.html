<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Rental Timer System</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background-color: #1e1e1e;
      width: 100%;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      border-bottom: 2px solid #333;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      width: 90%;
      max-width: 600px;
      margin-top: 2rem;
    }
    .card {
      background-color: #1e1e1e;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .card h2 {
      margin-top: 0;
      text-align: center;
      color: #00bcd4;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }
    button {
      background-color: #00bcd4;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0097a7;
    }
    .timer-display {
      font-size: 2rem;
      text-align: center;
      margin: 1rem 0;
    }
    .price-info {
      text-align: center;
      font-weight: 500;
      color: #ccc;
    }
    footer {
      margin-top: auto;
      padding: 1rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>💻 PC Rental Timer System</header>

  <main>
    <!-- Rental Timer -->
    <div class="card">
      <h2>Timer</h2>
      <p class="price-info">₱5 = 20 minutes</p>

      <div class="timer-display" id="timerDisplay">00:00</div>

      <input type="number" id="minutesInput" placeholder="Enter rental time in minutes" />
      <button id="startBtn">Start Timer</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <!-- Time Calculator -->
    <div class="card">
      <h2>🕒 Time Calculator</h2>
      <p>Enter amount (₱) to see how long it can be used:</p>
      <input type="number" id="moneyInput" placeholder="Enter amount in pesos" />
      <button id="calcTimeBtn">Calculate Time</button>
      <p id="timeResult"></p>
    </div>

    <!-- Cost Calculator -->
    <div class="card">
      <h2>💰 Cost Calculator</h2>
      <p>Enter desired time (minutes) to see the cost:</p>
      <input type="number" id="timeInput" placeholder="Enter time in minutes" />
      <button id="calcCostBtn">Calculate Cost</button>
      <p id="costResult"></p>
    </div>
  </main>

  <footer>© 2025 PC Rental Timer | ₱5 per 20 minutes</footer>

  <script>
    // Fixed rate
    const RATE_PER_PESO = 20 / 5; // 4 minutes per peso
    const RATE_PER_20_MIN = 5;

    let timerInterval;
    let remainingSeconds = 0;
    let isPaused = true;

    const timerDisplay = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Timer functions
    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(
        seconds
      ).padStart(2, '0')}`;
    }

    function startTimer() {
      const inputMinutes = parseInt(document.getElementById('minutesInput').value);
      if (!isPaused && remainingSeconds > 0) return;

      if (inputMinutes && remainingSeconds === 0) {
        remainingSeconds = inputMinutes * 60;
      }

      if (remainingSeconds <= 0) return alert('Enter valid minutes.');

      isPaused = false;
      timerInterval = setInterval(() => {
        if (!isPaused) {
          remainingSeconds--;
          updateDisplay();

          if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            alert('⏰ Time is up! Please extend or stop usage.');
            timerDisplay.textContent = '00:00';
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      isPaused = true;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      remainingSeconds = 0;
      updateDisplay();
      isPaused = true;
    }

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Time Calculator (Money → Time)
    document.getElementById('calcTimeBtn').addEventListener('click', () => {
      const money = parseFloat(document.getElementById('moneyInput').value);
      if (isNaN(money) || money <= 0) {
        document.getElementById('timeResult').textContent = 'Please enter a valid amount.';
        return;
      }
      const totalMinutes = money * RATE_PER_PESO;
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      document.getElementById(
        'timeResult'
      ).textContent = `${money.toFixed(2)} pesos = ${hours} hour(s) and ${minutes.toFixed(0)} minute(s)`;
    });

    // Cost Calculator (Time → Money)
    document.getElementById('calcCostBtn').addEventListener('click', () => {
      const time = parseFloat(document.getElementById('timeInput').value);
      if (isNaN(time) || time <= 0) {
        document.getElementById('costResult').textContent = 'Please enter a valid time.';
        return;
      }
      const cost = (time / 20) * RATE_PER_20_MIN;
      document.getElementById('costResult').textContent = `${time} minutes = ₱${cost.toFixed(2)}`;
    });

    updateDisplay();
  </script>
</body>
</html>
