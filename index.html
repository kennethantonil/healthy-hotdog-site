<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthy White Hotdogs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
    .transition-transform { transition: transform 0.7s ease-in-out; }
    .category-btn.active { font-weight: 600; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); }
  </style>
</head>

<body class="font-inter bg-gray-50 text-gray-800">
  <div class="min-h-screen flex flex-col relative">

    <!-- Header -->
    <header class="bg-white shadow p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center z-10">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full gap-4">
        <img src="https://i.imgur.com/V3eQP4i.jpeg" alt="Mommy Sam's Logo" class="h-10 md:h-14 rounded-full">
        <input id="searchInput" type="text" placeholder="Search products..." class="border rounded px-2 py-1 text-sm w-full sm:w-60">
        <div class="flex gap-3">
          <button id="settingsToggle" aria-label="Settings" class="relative">
            <svg class="w-6 h-6 text-gray-700" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 16a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0-10a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 20a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" />
            </svg>
          </button>
          <button id="cartToggle" aria-label="Toggle Cart" class="relative">
            <svg class="w-6 h-6 text-gray-700" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3 3h2l.4 2H21l-3.6 7H7.4L6 6H4.4l-.4-2zM7 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs px-1.5 rounded-full hidden">0</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Carousel -->
    <div class="relative w-full overflow-hidden max-w-screen-xl mx-auto mt-4 rounded-xl">
      <div id="carousel" class="whitespace-nowrap transition-transform duration-700 ease-in-out">
        <img src="https://i.imgur.com/Kg68IWo.jpeg" class="inline-block w-full h-48 object-cover" />
        <img src="https://i.imgur.com/vzDJzkV.jpeg" class="inline-block w-full h-48 object-cover" />
      </div>
    </div>

    <!-- Categories -->
    <nav class="w-full px-4 py-2 bg-white shadow-sm z-10">
      <div class="grid grid-cols-2 sm:flex flex-wrap sm:justify-center gap-2 w-full" id="categoryFilters">
        <span data-category="Chicken Hotdog" class="category-btn px-3 py-2 bg-yellow-100 text-yellow-700 rounded-full text-sm cursor-pointer hover:bg-yellow-200 transition w-full sm:w-auto text-center">Chicken Hotdog</span>
        <span data-category="Fish Hotdog" class="category-btn px-3 py-2 bg-blue-100 text-blue-700 rounded-full text-sm cursor-pointer hover:bg-blue-200 transition w-full sm:w-auto text-center">Fish Hotdog</span>
        <span data-category="Beef Hotdog" class="category-btn px-3 py-2 bg-red-100 text-red-700 rounded-full text-sm cursor-pointer hover:bg-red-200 transition w-full sm:w-auto text-center">Beef Hotdog</span>
        <span data-category="Regular Hotdog" class="category-btn px-3 py-2 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200 transition w-full sm:w-auto text-center">Regular Hotdog</span>
        <span data-category="All" class="category-btn px-3 py-2 bg-green-100 text-green-700 rounded-full text-sm cursor-pointer hover:bg-green-200 transition w-full sm:w-auto text-center active">All</span>
      </div>
    </nav>

    <!-- Product List -->
    <main class="flex-1 p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="productList"></main>

    <!-- Floating Contact -->
    <a href="https://www.facebook.com/MommySamWhiteHotdog" class="fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded-full shadow-lg text-sm sm:text-base z-50">Contact Us</a>

    <!-- Scripts -->
    <script>
      const carousel = document.getElementById('carousel');
      let currentSlide = 0;
      const totalSlides = carousel.children.length;
      setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        carousel.style.transform = `translateX(-${currentSlide * 100}%)`;
      }, 4000);

      const products = [
        { name: "Chicken Delight", category: "Chicken Hotdog", price: "₱120", image: "https://i.imgur.com/V3eQP4i.jpeg" },
        { name: "Fish Supreme", category: "Fish Hotdog", price: "₱130", image: "https://i.imgur.com/V3eQP4i.jpeg" },
        { name: "Beefy Bites", category: "Beef Hotdog", price: "₱150", image: "https://i.imgur.com/V3eQP4i.jpeg" },
        { name: "Classic Red", category: "Regular Hotdog", price: "₱100", image: "https://i.imgur.com/V3eQP4i.jpeg" },
        { name: "Fishy Fun", category: "Fish Hotdog", price: "₱125", image: "https://i.imgur.com/V3eQP4i.jpeg" },
        { name: "Tender Chicken", category: "Chicken Hotdog", price: "₱115", image: "https://i.imgur.com/V3eQP4i.jpeg" },
      ];

      const productList = document.getElementById("productList");
      const filters = document.querySelectorAll(".category-btn");
      const searchInput = document.getElementById("searchInput");
      const cartCount = document.getElementById("cartCount");

      let cart = [];

      function renderProducts(category = "All", search = "") {
        productList.innerHTML = "";

        let filtered = products.filter(p =>
          (category === "All" || p.category === category) &&
          p.name.toLowerCase().includes(search.toLowerCase())
        );

        if (filtered.length === 0) {
          productList.innerHTML = `<p class="col-span-full text-center text-gray-500">No products found.</p>`;
          return;
        }

        filtered.forEach(p => {
          const div = document.createElement("div");
          div.className = "bg-white p-4 rounded-xl shadow text-center";
          div.innerHTML = `
            <img src="${p.image}" alt="${p.name}" class="w-full h-40 object-cover rounded-lg mb-3">
            <h3 class="font-semibold">${p.name}</h3>
            <p class="text-gray-600 mb-2">${p.category}</p>
            <p class="font-bold text-lg">${p.price}</p>
            <button class="mt-2 px-4 py-1 bg-green-500 text-white rounded-full text-sm add-to-cart">Add to Cart</button>
          `;
          div.querySelector(".add-to-cart").addEventListener("click", () => {
            cart.push(p);
            cartCount.textContent = cart.length;
            cartCount.classList.remove("hidden");
          });
          productList.appendChild(div);
        });
      }

      renderProducts();

      filters.forEach(btn => {
        btn.addEventListener("click", () => {
          filters.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderProducts(btn.dataset.category, searchInput.value);
        });
      });

      searchInput.addEventListener("input", () => {
        const selected = document.querySelector(".category-btn.active");
        const category = selected ? selected.dataset.category : "All";
        renderProducts(category, searchInput.value);
      });
    </script>
  </div>
</body>

</html>
