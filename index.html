<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRA NEWS Lower Third v2</title>
<style>
  body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", "Arial", sans-serif;
  }

  /* ===== LOWER THIRD ===== */
  .lowerthird {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 1920px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .banner {
    position: relative;
    width: 100%;
    height: 180px;
    background: linear-gradient(90deg, #001d3d, #003a88 50%, #b30000 100%);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  .banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.15), transparent 70%);
    mix-blend-mode: overlay;
  }

  /* Shine sweep */
  .shine {
    position: absolute;
    top: 0;
    left: -150%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, rgba(255,255,255,0.4), transparent 70%);
    transform: skewX(-25deg);
  }

  /* Larger integrated logo */
  .logo-box {
    position: absolute;
    left: 1%;
    top: 50%;
    transform: translateY(-50%);
    width: 260px;
    height: auto;
    z-index: 3;
  }

  .logo-box img {
    width: 100%;
    height: auto;
  }

  .text-content {
    position: absolute;
    left: 300px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
  }

  .headline {
    font-size: 58px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .subheadline {
    font-size: 30px;
    font-weight: 500;
    color: #e0e0e0;
    text-shadow: 0 0 6px rgba(0,0,0,0.4);
  }

  /* ===== TICKER ===== */
  .ticker {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 55px;
    background: linear-gradient(90deg, #b30000, #003a88 60%, #001d3d);
    overflow: hidden;
    color: #fff;
    border-top: 3px solid #d00000;
  }

  .ticker span {
    display: inline-block;
    padding-right: 100px;
    animation: tickerMove 25s linear infinite;
    white-space: nowrap;
    font-size: 26px;
    font-weight: 600;
  }

  @keyframes tickerMove {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
  }

  /* ===== CONTROL PANEL ===== */
  .control-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 15px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 100;
    width: 320px;
    backdrop-filter: blur(10px);
  }

  .control-panel input, .control-panel textarea {
    width: 100%;
    margin: 5px 0 10px 0;
    border: none;
    border-radius: 6px;
    padding: 8px;
    font-size: 14px;
    outline: none;
  }

  .control-panel button {
    width: 48%;
    margin: 2px 1%;
    background: linear-gradient(90deg, #007bff, #00bfff);
    border: none;
    border-radius: 6px;
    padding: 8px;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  .control-panel button:hover {
    background: linear-gradient(90deg, #00bfff, #007bff);
  }

  .control-title {
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
    color: #00bfff;
  }
</style>
</head>
<body>

<!-- ===== LOWER THIRD ===== -->
<div class="lowerthird" id="lowerthird">
  <div class="banner">
    <div class="shine"></div>
    <div class="logo-box">
      <img src="KRA NEWS LOGO.png" alt="KRA NEWS">
    </div>
    <div class="text-content">
      <div class="headline" id="headline">BREAKING NEWS</div>
      <div class="subheadline" id="subheadline">Live from Manila | Anchored by Kenneth Antonil</div>
    </div>
  </div>
</div>

<div class="ticker" id="tickerBar">
  <span id="tickerText">KRA NEWS UPDATE: President delivers national address | Weather Alert: Storm entering PAR | More updates at kranews.tv</span>
</div>

<!-- ===== CONTROL PANEL ===== -->
<div class="control-panel">
  <div class="control-title">🎛 KRA NEWS CONTROL</div>
  <label>Headline:</label>
  <input type="text" id="inputHeadline" value="BREAKING NEWS">
  <label>Subheadline:</label>
  <input type="text" id="inputSubheadline" value="Live from Manila | Anchored by Kenneth Antonil">
  <label>Ticker:</label>
  <textarea id="inputTicker" rows="2">KRA NEWS UPDATE: President delivers national address | Weather Alert: Storm entering PAR | More updates at kranews.tv</textarea>
  <div>
    <button id="btnShow">Show</button>
    <button id="btnHide">Hide</button>
  </div>
  <div>
    <button id="btnUpdate">Update Text</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const lowerthird = document.getElementById("lowerthird");
  const banner = document.querySelector(".banner");
  const shine = document.querySelector(".shine");
  const tickerBar = document.getElementById("tickerBar");
  const logo = document.querySelector(".logo-box");

  gsap.set(lowerthird, {y: 200, opacity: 0});
  gsap.set(tickerBar, {y: 100, opacity: 0});
  gsap.set(shine, {x: "-150%"});

  // ====== ANIMATION SEQUENCE ======
  function animateIn() {
    // Split and slide effect
    const tl = gsap.timeline();
    tl.fromTo(banner, {clipPath: "inset(0 50% 0 50%)"}, {duration: 1.2, clipPath: "inset(0 0% 0 0%)", ease: "power4.out"});
    tl.to(lowerthird, {duration: 0.6, y: 0, opacity: 1, ease: "power3.out"}, "<");
    tl.from(logo, {duration: 0.8, scale: 0.2, rotationY: 90, opacity: 0, ease: "back.out(1.7)"}, "-=0.3");
    tl.from(".headline", {duration: 0.7, y: 60, opacity: 0, ease: "back.out(1.5)"}, "-=0.4");
    tl.from(".subheadline", {duration: 0.7, y: 60, opacity: 0, ease: "back.out(1.5)"}, "-=0.5");
    tl.to(tickerBar, {duration: 0.8, y: 0, opacity: 1, ease: "power4.out"}, "-=0.4");
    gsap.to(shine, {duration: 2.5, x: "300%", repeat: -1, ease: "linear", delay: 1});
  }

  function animateOut() {
    const tl = gsap.timeline();
    tl.to([lowerthird, tickerBar], {duration: 1, y: 200, opacity: 0, ease: "power4.in"});
  }

  // ===== CONTROL PANEL =====
  document.getElementById("btnShow").onclick = animateIn;
  document.getElementById("btnHide").onclick = animateOut;

  document.getElementById("btnUpdate").onclick = () => {
    const h = document.getElementById("inputHeadline").value;
    const s = document.getElementById("inputSubheadline").value;
    const t = document.getElementById("inputTicker").value;
    document.getElementById("headline").textContent = h;
    document.getElementById("subheadline").textContent = s;
    document.getElementById("tickerText").textContent = t;
  };
</script>

</body>
</html>
