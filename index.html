<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Rental Timer System</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: white;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .pc-box {
      background: #1f1f1f;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      width: 300px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .pc-box:hover {
      transform: scale(1.03);
    }
    h2 {
      margin-bottom: 10px;
      font-size: 1.3em;
    }
    input {
      width: 90%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 1em;
    }
    button {
      background-color: #00c853;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #00a843;
    }
    .stop-btn {
      background-color: #ff5252;
      margin-left: 5px;
    }
    .stop-btn:hover {
      background-color: #e04848;
    }
    .info {
      text-align: left;
      margin-top: 15px;
      font-size: 1em;
    }
    .timer {
      font-size: 2em;
      font-weight: bold;
      color: #ff5252;
      text-align: center;
      margin-top: 10px;
    }
    .time-label {
      color: #aaa;
      font-size: 0.9em;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Generate 4 PCs -->
  <div id="pcs"></div>

<script>
  const pcCount = 4; // number of PCs
  const timers = {};

  function createPCBoxes() {
    const container = document.getElementById('pcs');
    for (let i = 1; i <= pcCount; i++) {
      container.innerHTML += `
      <div class="pc-box" id="pc${i}">
        <h2>💻 PC ${i}</h2>
        <input type="text" id="name${i}" placeholder="Customer Name">
        <input type="number" id="amount${i}" placeholder="Amount (₱)" min="1">
        <div>
          <button onclick="startTimer(${i})">Start</button>
          <button class="stop-btn" onclick="stopTimer(${i})">Stop</button>
        </div>
        <div class="info">
          <p><b>Name:</b> <span id="displayName${i}">-</span></p>
          <p><b>Amount:</b> ₱<span id="displayAmount${i}">0</span></p>
          <p><b>Time Remaining:</b></p>
          <div class="timer" id="timeRemaining${i}">00:00</div>
          <p class="time-label">🕒 Current Time: <span id="currentTime${i}">--:--:--</span></p>
          <p class="time-label">⏰ End Time: <span id="endTime${i}">--:--:--</span></p>
        </div>
      </div>`;
    }
  }

  createPCBoxes();

  // Function to update all current times
  setInterval(() => {
    const now = new Date();
    const current = now.toLocaleTimeString();
    for (let i = 1; i <= pcCount; i++) {
      document.getElementById(`currentTime${i}`).textContent = current;
    }
  }, 1000);

  function startTimer(pcNumber) {
    stopTimer(pcNumber);

    const name = document.getElementById(`name${pcNumber}`).value;
    const amount = parseFloat(document.getElementById(`amount${pcNumber}`).value);

    if (!name || isNaN(amount) || amount <= 0) {
      alert("Please enter a valid name and amount.");
      return;
    }

    let totalSeconds = amount * 4 * 60; // 1 peso = 4 mins
    const endTime = new Date(Date.now() + totalSeconds * 1000);

    document.getElementById(`displayName${pcNumber}`).textContent = name;
    document.getElementById(`displayAmount${pcNumber}`).textContent = amount.toFixed(2);
    document.getElementById(`endTime${pcNumber}`).textContent = endTime.toLocaleTimeString();

    timers[pcNumber] = setInterval(() => {
      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;
      document.getElementById(`timeRemaining${pcNumber}`).textContent =
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      if (totalSeconds <= 0) {
        clearInterval(timers[pcNumber]);
        document.getElementById(`timeRemaining${pcNumber}`).textContent = "00:00";
        alert(`Time is up for ${name} (PC ${pcNumber})!`);
      }
      totalSeconds--;
    }, 1000);
  }

  function stopTimer(pcNumber) {
    clearInterval(timers[pcNumber]);
  }
</script>

</body>
</html>
