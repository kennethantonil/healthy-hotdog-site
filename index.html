<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>NearMe Jobs — Find & Post Local Jobs</title>
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind config (soft modern palette)
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          colors: {
            brand: {
              50: "#eef2ff",
              100: "#e0e7ff",
              200: "#c7d2fe",
              300: "#a5b4fc",
              400: "#818cf8",
              500: "#6366f1",
              600: "#4f46e5",
              700: "#4338ca",
              800: "#3730a3",
              900: "#312e81",
            },
          },
          boxShadow: {
            soft: "0 10px 30px -12px rgba(0,0,0,.15)",
            card: "0 6px 20px -8px rgba(0,0,0,.12)",
          },
        },
      },
    };
  </script>
  <style>
    /* Hide native dialog outline */
    dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(3px); }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .nice-scroll::-webkit-scrollbar { height: 10px; width: 10px; }
    .nice-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; }
    .nice-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <!-- Top bar -->
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4">
      <div class="flex items-center justify-between py-3">
        <button class="flex items-center gap-2" onclick="location.reload()">
          <span
            class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-brand-600 text-white shadow-soft"
            aria-hidden="true"
          >🧭</span>
          <div class="text-left">
            <div class="text-lg font-bold leading-5">NearMe <span class="text-brand-600">Jobs</span></div>
            <div class="text-xs text-slate-500 -mt-0.5">Find great work close by</div>
          </div>
        </button>

        <nav class="flex items-center gap-2">
          <button id="btn-open-post" class="hidden sm:inline-flex rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-soft hover:bg-brand-700 transition">
            + Post a Job
          </button>

          <!-- Auth: logged out -->
          <div id="auth-area" class="flex items-center gap-2">
            <button id="btn-login" class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Log in</button>
            <button id="btn-signup" class="rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800">Sign up</button>
          </div>

          <!-- Auth: logged in -->
          <div id="user-area" class="hidden items-center gap-2">
            <span id="user-email" class="hidden sm:inline text-sm text-slate-600"></span>
            <button id="btn-dashboard" class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">My Jobs</button>
            <button id="btn-open-post-2" class="inline-flex sm:hidden rounded-lg bg-brand-600 px-3 py-2 text-sm font-semibold text-white">+ Post</button>
            <button id="btn-logout" class="rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold text-white hover:bg-red-700">Log out</button>
          </div>
        </nav>
      </div>
    </div>
  </header>

  <!-- Search panel -->
  <section class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-4">
      <div class="grid gap-3 py-4 md:grid-cols-12">
        <div class="md:col-span-4">
          <label class="sr-only" for="search-keyword">Keywords</label>
          <input id="search-keyword" type="text" placeholder="Job title, company, or keywords…"
                 class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 shadow-card focus:border-brand-400 focus:ring-2 focus:ring-brand-100" />
        </div>
        <div class="md:col-span-3">
          <label class="sr-only" for="filter-category">Category</label>
          <select id="filter-category"
                  class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 shadow-card focus:border-brand-400 focus:ring-2 focus:ring-brand-100">
            <option value="">All categories</option>
            <option>Customer Service</option>
            <option>Sales</option>
            <option>Marketing</option>
            <option>IT / Software</option>
            <option>Design</option>
            <option>Operations</option>
            <option>Logistics</option>
            <option>Healthcare</option>
            <option>Education</option>
            <option>Others</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 mb-1" for="filter-salary-min">Min salary (monthly)</label>
          <input id="filter-salary-min" type="number" min="0" placeholder="₱"
                 class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 shadow-card focus:border-brand-400 focus:ring-2 focus:ring-brand-100" />
        </div>
        <div class="md:col-span-3">
          <div class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 shadow-card">
            <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
              <label for="filter-distance">Max distance</label>
              <span id="distance-value" class="text-slate-700">Any</span>
            </div>
            <input id="filter-distance" type="range" min="0" max="50" step="1" value="0" class="range w-full accent-brand-600" />
            <div class="mt-2 flex items-center gap-2">
              <button id="btn-locate" class="inline-flex items-center gap-2 rounded-lg bg-slate-900 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/></svg>
                Use my location
              </button>
              <small id="geo-status" class="text-xs text-slate-500"></small>
            </div>
          </div>
        </div>
        <div class="md:col-span-12 flex items-center justify-end gap-2">
          <button id="btn-search" class="inline-flex items-center gap-2 rounded-xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white shadow-soft hover:bg-brand-700 transition">
            <span>Search</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Content -->
  <main class="mx-auto max-w-6xl px-4">
    <!-- Stats / header -->
    <div class="flex items-baseline justify-between py-5">
      <h2 class="text-xl font-bold">Job Listings</h2>
      <span id="result-count" class="text-sm text-slate-500"></span>
    </div>

    <!-- Job list -->
    <div id="jobs-list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="empty" class="hidden rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-500 shadow-card">
      No jobs found. Try changing filters or location.
    </div>

    <!-- Dashboard -->
    <section id="dashboard" class="hidden mt-10">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold">My Posted Jobs</h3>
      </div>
      <div id="my-jobs" class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
      <div id="my-empty" class="hidden rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-500 shadow-card">You haven't posted any jobs yet.</div>
    </section>
  </main>

  <!-- Post Job Modal -->
  <dialog id="post-dialog" class="w-[min(720px,92vw)] rounded-2xl p-0">
    <form id="post-form" method="dialog" class="grid gap-4 p-5">
      <div class="flex items-start justify-between">
        <h3 class="text-lg font-bold">Post a Job</h3>
        <button type="reset" id="btn-cancel-post" class="rounded-lg px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-100">✕</button>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Job Title</label>
          <input name="title" required placeholder="e.g., Sales Associate" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
        </div>
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Company</label>
          <input name="company" required placeholder="Your company name" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
        </div>
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Category</label>
          <select name="category" required class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card">
            <option>Customer Service</option>
            <option>Sales</option>
            <option>Marketing</option>
            <option>IT / Software</option>
            <option>Design</option>
            <option>Operations</option>
            <option>Logistics</option>
            <option>Healthcare</option>
            <option>Education</option>
            <option>Others</option>
          </select>
        </div>
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Monthly Salary Range (₱)</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" name="salaryMin" min="0" placeholder="Min" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
            <input type="number" name="salaryMax" min="0" placeholder="Max" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
          </div>
        </div>
        <div class="sm:col-span-2 grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Job Description</label>
          <textarea name="description" rows="5" required placeholder="Responsibilities, requirements, schedule, benefits…"
                    class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card"></textarea>
        </div>
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Contact Email</label>
          <input type="email" name="contactEmail" required placeholder="hr@company.com" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
        </div>
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">City / Area</label>
          <input name="city" placeholder="e.g., Quezon City" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
        </div>
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Address (optional)</label>
          <input name="address" placeholder="Street, building, etc." class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
        </div>
        <div class="grid gap-1.5">
          <label class="text-xs font-semibold text-slate-500">Latitude / Longitude</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" step="any" name="lat" placeholder="14.5995" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
            <input type="number" step="any" name="lng" placeholder="120.9842" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
          </div>
          <div class="mt-2 flex items-center gap-2">
            <button type="button" id="btn-job-use-location" class="rounded-lg bg-slate-900 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800">📍 Use my location</button>
            <small class="text-xs text-slate-500">Auto-fill coordinates from your device.</small>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="reset" id="btn-cancel-post-2" class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">Cancel</button>
        <button type="submit" class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700">Publish Job</button>
      </div>
      <p id="post-status" class="text-xs text-slate-500"></p>
    </form>
  </dialog>

  <!-- Auth Modal -->
  <dialog id="auth-dialog" class="w-[min(460px,92vw)] rounded-2xl p-0">
    <form id="auth-form" method="dialog" class="grid gap-4 p-5">
      <div class="flex items-start justify-between">
        <h3 id="auth-title" class="text-lg font-bold">Log in</h3>
        <button type="reset" id="btn-cancel-auth" class="rounded-lg px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-100">✕</button>
      </div>
      <div class="grid gap-2">
        <label class="text-xs font-semibold text-slate-500">Email</label>
        <input type="email" name="email" required placeholder="you@example.com" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
      </div>
      <div class="grid gap-2">
        <label class="text-xs font-semibold text-slate-500">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-card" />
      </div>
      <div class="flex items-center justify-between">
        <p class="text-xs text-slate-500">No account yet?
          <a href="#" id="link-switch-auth" class="font-semibold text-brand-600 hover:underline">Sign up</a>
        </p>
        <button id="btn-auth-submit" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Continue</button>
      </div>
      <p id="auth-status" class="text-xs text-slate-500"></p>
    </form>
  </dialog>

  <!-- Job Card Template -->
  <template id="job-card-tpl">
    <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-card hover:shadow-soft transition">
      <div class="mb-2 flex items-start justify-between gap-3">
        <h4 class="job-title text-lg font-semibold"></h4>
        <span class="badge category rounded-full bg-brand-50 px-2.5 py-1 text-xs font-semibold text-brand-700 ring-1 ring-inset ring-brand-200"></span>
      </div>
      <p class="company text-sm font-medium text-slate-600"></p>
      <p class="desc line-clamp-3 mt-2 text-sm text-slate-600"></p>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-500">
        <span class="salary inline-flex items-center gap-1 rounded-full bg-slate-100 px-2 py-1"></span>
        <span class="distance inline-flex items-center gap-1 rounded-full bg-slate-100 px-2 py-1"></span>
        <span class="city inline-flex items-center gap-1 rounded-full bg-slate-100 px-2 py-1"></span>
      </div>
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <a class="contact inline-flex items-center justify-center rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800" target="_blank" rel="noopener">Contact</a>
        <button class="btn tiny outline edit hidden rounded-lg border border-brand-600 px-2.5 py-1.5 text-xs font-semibold text-brand-700 hover:bg-brand-50">Edit</button>
        <button class="btn tiny danger delete hidden rounded-lg bg-red-600 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-red-700">Delete</button>
        <small class="posted ml-auto text-xs text-slate-500"></small>
      </div>
    </article>
  </template>

  <!-- App Logic -->
  <script type="module">
    // Firebase — modular v10
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // === PASTE YOUR FIREBASE CONFIG HERE ===
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI refs
    const jobsListEl = document.getElementById('jobs-list');
    const emptyEl = document.getElementById('empty');
    const resultCountEl = document.getElementById('result-count');
    const myJobsEl = document.getElementById('my-jobs');
    const myEmptyEl = document.getElementById('my-empty');
    const dashboardSection = document.getElementById('dashboard');

    const btnOpenPost = document.getElementById('btn-open-post');
    const btnOpenPost2 = document.getElementById('btn-open-post-2');
    const postDialog = document.getElementById('post-dialog');
    const postForm = document.getElementById('post-form');
    const postStatus = document.getElementById('post-status');
    const btnJobUseLocation = document.getElementById('btn-job-use-location');

    const btnLogin = document.getElementById('btn-login');
    const btnSignup = document.getElementById('btn-signup');
    const authDialog = document.getElementById('auth-dialog');
    const authForm = document.getElementById('auth-form');
    const authTitle = document.getElementById('auth-title');
    const linkSwitchAuth = document.getElementById('link-switch-auth');
    const authStatus = document.getElementById('auth-status');
    const btnCancelAuth = document.getElementById('btn-cancel-auth');
    const authArea = document.getElementById('auth-area');
    const userArea = document.getElementById('user-area');
    const userEmailEl = document.getElementById('user-email');
    const btnLogout = document.getElementById('btn-logout');
    const btnDashboard = document.getElementById('btn-dashboard');

    const btnLocate = document.getElementById('btn-locate');
    const geoStatus = document.getElementById('geo-status');
    const distanceRange = document.getElementById('filter-distance');
    const distanceValue = document.getElementById('distance-value');
    const filterCategory = document.getElementById('filter-category');
    const filterSalaryMin = document.getElementById('filter-salary-min');
    const searchKeyword = document.getElementById('search-keyword');
    const btnSearch = document.getElementById('btn-search');

    const jobCardTpl = document.getElementById('job-card-tpl');

    let currentUser = null;
    let allJobs = [];
    let userLocation = null; // {lat, lng}
    let authMode = 'login';

    // Helpers
    const toRad = v => v * Math.PI / 180;
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      const c = 2 * Math.asin(Math.sqrt(a));
      return R * c;
    }
    const fmtPeso = x => (x == null || x === '') ? '' : '₱' + Number(x).toLocaleString();
    function timeAgo(ts) {
      const now = new Date();
      const d = ts?.toDate?.() ?? ts ?? now;
      const diff = (now - d) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff/60) + 'm ago';
      if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
      return Math.floor(diff/86400) + 'd ago';
    }

    function toast(msg, type='info') {
      const el = document.createElement('div');
      el.className = `fixed left-1/2 top-4 z-[100] -translate-x-1/2 rounded-xl px-4 py-2 text-sm font-semibold text-white shadow-soft ${type==='error' ? 'bg-red-600' : type==='ok' ? 'bg-emerald-600' : 'bg-slate-900'}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(()=>{ el.remove(); }, 2000);
    }

    function renderJobs(list, targetEl, emptyEl) {
      targetEl.innerHTML = '';
      if (!list.length) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      for (const job of list) {
        const frag = jobCardTpl.content.cloneNode(true);
        frag.querySelector('.job-title').textContent = job.title;
        frag.querySelector('.category').textContent = job.category || 'Others';
        frag.querySelector('.company').textContent = job.company || '';
        frag.querySelector('.desc').textContent = job.description || '';
        const salaryStr = (job.salaryMin || job.salaryMax)
          ? `${fmtPeso(job.salaryMin)}${job.salaryMax? ' – '+fmtPeso(job.salaryMax): ''}`
          : 'Salary: Not specified';
        frag.querySelector('.salary').textContent = salaryStr;
        frag.querySelector('.city').textContent = job.city ? job.city : (job.address || '');

        // Distance
        const distanceEl = frag.querySelector('.distance');
        if (userLocation && job.lat && job.lng) {
          const d = haversine(userLocation.lat, userLocation.lng, job.lat, job.lng);
          distanceEl.textContent = d.toFixed(1) + ' km';
        } else {
          distanceEl.textContent = '';
        }

        // Contact
        const contact = frag.querySelector('.contact');
        const mailto = `mailto:${encodeURIComponent(job.contactEmail || '')}?subject=${encodeURIComponent('Application: ' + (job.title||'Job'))}`;
        contact.href = mailto;

        // Owner controls
        if (currentUser && job.uid === currentUser.uid) {
          const editBtn = frag.querySelector('.edit');
          const delBtn = frag.querySelector('.delete');
          editBtn.classList.remove('hidden');
          delBtn.classList.remove('hidden');
          editBtn.addEventListener('click', () => openEdit(job));
          delBtn.addEventListener('click', () => deleteJob(job));
        }

        frag.querySelector('.posted').textContent = 'Posted ' + timeAgo(job.createdAt);
        targetEl.appendChild(frag);
      }
    }

    function filterJobs() {
      const kw = (searchKeyword.value || '').toLowerCase().trim();
      const cat = filterCategory.value;
      const minSal = Number(filterSalaryMin.value || 0);
      const maxDist = Number(distanceRange.value || 0);

      let list = allJobs.filter(j => {
        const text = (j.title + ' ' + j.company + ' ' + j.description).toLowerCase();
        if (kw && !text.includes(kw)) return false;
        if (cat && j.category !== cat) return false;
        if (minSal && (!j.salaryMin || j.salaryMin < minSal)) return false;
        if (maxDist > 0 && userLocation && j.lat && j.lng) {
          const d = haversine(userLocation.lat, userLocation.lng, j.lat, j.lng);
          if (d > maxDist) return false;
        }
        return true;
      });

      if (userLocation) {
        list = list.slice().sort((a,b) => {
          const da = (a.lat && a.lng) ? haversine(userLocation.lat, userLocation.lng, a.lat, a.lng) : Infinity;
          const db = (b.lat && b.lng) ? haversine(userLocation.lat, userLocation.lng, b.lat, b.lng) : Infinity;
          return da - db;
        });
      }

      resultCountEl.textContent = list.length ? `${list.length} result(s)` : '';
      renderJobs(list, jobsListEl, emptyEl);
    }

    function openEdit(job) {
      postDialog.showModal();
      postStatus.textContent = 'Editing…';
      postForm.dataset.editId = job.id;
      postForm.title.value = job.title || '';
      postForm.company.value = job.company || '';
      postForm.category.value = job.category || 'Others';
      postForm.salaryMin.value = job.salaryMin || '';
      postForm.salaryMax.value = job.salaryMax || '';
      postForm.description.value = job.description || '';
      postForm.contactEmail.value = job.contactEmail || currentUser?.email || '';
      postForm.city.value = job.city || '';
      postForm.address.value = job.address || '';
      postForm.lat.value = job.lat || '';
      postForm.lng.value = job.lng || '';
    }

    async function deleteJob(job) {
      if (!confirm('Delete this job?')) return;
      try {
        await deleteDoc(doc(db, 'jobs', job.id));
        toast('Deleted', 'ok');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // Auth modal logic
    btnLogin?.addEventListener('click', () => { authMode = 'login'; authTitle.textContent = 'Log in'; authDialog.showModal(); });
    btnSignup?.addEventListener('click', () => { authMode = 'signup'; authTitle.textContent = 'Sign up'; authDialog.showModal(); });
    linkSwitchAuth?.addEventListener('click', (e) => {
      e.preventDefault();
      authMode = (authMode === 'login') ? 'signup' : 'login';
      authTitle.textContent = authMode === 'login' ? 'Log in' : 'Sign up';
    });
    btnCancelAuth?.addEventListener('click', () => authDialog.close());

    authForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = authForm.email.value;
      const password = authForm.password.value;
      authStatus.textContent = 'Please wait…';
      try {
        if (authMode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        authStatus.textContent = 'Success!';
        authDialog.close();
        toast('Welcome 👋', 'ok');
      } catch (err) {
        authStatus.textContent = err.message;
        toast(err.message, 'error');
      }
    });

    btnLogout?.addEventListener('click', async () => {
      await signOut(auth);
      toast('Logged out', 'ok');
    });

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        authArea.classList.add('hidden');
        userArea.classList.remove('hidden');
        userEmailEl.textContent = user.email;
        btnOpenPost?.classList.remove('hidden');
      } else {
        authArea.classList.remove('hidden');
        userArea.classList.add('hidden');
        userEmailEl.textContent = '';
        dashboardSection.classList.add('hidden');
      }
    });

    // Post job modal
    function openPost() {
      if (!currentUser) { authMode='login'; authTitle.textContent='Log in'; authDialog.showModal(); return; }
      postForm.reset();
      postForm.dataset.editId = '';
      postStatus.textContent = '';
      if (currentUser?.email) postForm.contactEmail.value = currentUser.email;
      postDialog.showModal();
    }
    btnOpenPost?.addEventListener('click', openPost);
    btnOpenPost2?.addEventListener('click', openPost);
    document.getElementById('btn-cancel-post')?.addEventListener('click', () => postDialog.close());
    document.getElementById('btn-cancel-post-2')?.addEventListener('click', () => postDialog.close());

    btnJobUseLocation?.addEventListener('click', async () => {
      const coords = await getUserLocation();
      if (coords) {
        postForm.lat.value = coords.lat.toFixed(6);
        postForm.lng.value = coords.lng.toFixed(6);
        postStatus.textContent = 'Location filled.';
      }
    });

    postForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { toast('Please log in to post.', 'error'); return; }
      const data = {
        title: postForm.title.value.trim(),
        company: postForm.company.value.trim(),
        category: postForm.category.value,
        salaryMin: postForm.salaryMin.value ? Number(postForm.salaryMin.value) : null,
        salaryMax: postForm.salaryMax.value ? Number(postForm.salaryMax.value) : null,
        description: postForm.description.value.trim(),
        contactEmail: postForm.contactEmail.value.trim(),
        city: postForm.city.value.trim(),
        address: postForm.address.value.trim(),
        lat: postForm.lat.value ? Number(postForm.lat.value) : null,
        lng: postForm.lng.value ? Number(postForm.lng.value) : null,
        uid: currentUser.uid,
        posterEmail: currentUser.email,
        createdAt: serverTimestamp()
      };
      try {
        if (postForm.dataset.editId) {
          await updateDoc(doc(db, 'jobs', postForm.dataset.editId), data);
          toast('Job updated', 'ok');
        } else {
          await addDoc(collection(db, 'jobs'), data);
          toast('Job posted', 'ok');
        }
        postDialog.close();
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    // Geolocation
    distanceRange?.addEventListener('input', () => {
      distanceValue.textContent = distanceRange.value === '0' ? 'Any' : (distanceRange.value + ' km');
    });

    btnLocate?.addEventListener('click', async () => {
      const coords = await getUserLocation();
      if (coords) {
        geoStatus.textContent = `Location set (${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)})`;
        toast('Location set ✅', 'ok');
        filterJobs();
      }
    });

    async function getUserLocation() {
      if (!('geolocation' in navigator)) {
        geoStatus.textContent = 'Geolocation not supported.';
        toast('Geolocation not supported', 'error');
        return null;
      }
      geoStatus.textContent = 'Getting location…';
      return new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition((pos) => {
          userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          geoStatus.textContent = 'Location ready.';
          resolve(userLocation);
        }, (err) => {
          geoStatus.textContent = err.message;
          toast(err.message, 'error');
          resolve(null);
        }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 });
      });
    }

    // Search
    btnSearch?.addEventListener('click', filterJobs);
    searchKeyword?.addEventListener('keydown', (e) => (e.key === 'Enter') && filterJobs());
    filterCategory?.addEventListener('change', filterJobs);
    filterSalaryMin?.addEventListener('change', filterJobs);
    distanceRange?.addEventListener('change', filterJobs);

    // Live jobs
    const jobsQ = query(collection(db, 'jobs'), orderBy('createdAt', 'desc'));
    onSnapshot(jobsQ, (snap) => {
      allJobs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      filterJobs();
      if (dashboardSection && !dashboardSection.classList.contains('hidden')) {
        loadMyJobs();
      }
    });

    // Dashboard
    btnDashboard?.addEventListener('click', () => {
      dashboardSection.classList.toggle('hidden');
      loadMyJobs();
    });

    function loadMyJobs() {
      if (!currentUser) return;
      const mine = allJobs.filter(j => j.uid === currentUser.uid);
      renderJobs(mine, myJobsEl, myEmptyEl);
    }
  </script>
</body>
</html>
