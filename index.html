<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthy White Hotdogs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
  </style>
</head>

<body class="font-inter bg-gray-50 text-gray-800">
  <div class="min-h-screen flex flex-col relative">
    <!-- Header -->
    <header class="bg-white shadow p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center z-10">
      <div class="flex items-center justify-between w-full sm:w-auto">
        <img src="/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg" alt="Mommy Sam's White Hotdog Logo" class="h-10 md:h-14">
        <button id="cartToggle" class="relative sm:ml-4 ml-auto">
          <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.6 8M17 13l1.6 8M6 21h12" />
          </svg>
          <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs px-1.5 rounded-full hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Variations below header -->
    <nav class="w-full px-4 py-2 bg-white shadow-sm flex flex-wrap gap-2 justify-center z-10">
      <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm cursor-pointer hover:bg-green-200 transition">Chicken Hotdog</span>
      <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm cursor-pointer hover:bg-blue-200 transition">Fish Hotdog</span>
      <span class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm cursor-pointer hover:bg-yellow-200 transition">Beef Hotdog</span>
      <span class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm cursor-pointer hover:bg-red-200 transition">Regular Hotdog</span>
    </nav>

    <!-- Notification -->
    <div id="notification" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-xl shadow z-50 transition-all">Added to cart!</div>

    <!-- Promotion Carousel -->
    <div class="w-full overflow-hidden relative mt-4">
      <div id="promoCarousel" class="flex transition-transform duration-700" style="width: 400%;">
        <img src="/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg" class="w-full object-cover h-48 sm:h-64 flex-shrink-0">
        <img src="/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg" class="w-full object-cover h-48 sm:h-64 flex-shrink-0">
        <img src="/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg" class="w-full object-cover h-48 sm:h-64 flex-shrink-0">
        <img src="/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg" class="w-full object-cover h-48 sm:h-64 flex-shrink-0">
      </div>
    </div>

    <!-- Product List -->
    <main class="flex-1 p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6" id="productList"></main>

    <!-- Cart Sidebar -->
    <aside id="cartSidebar" class="hidden fixed top-0 right-0 w-full sm:w-80 max-w-full h-full bg-white shadow-xl p-4 rounded-l-xl z-40 overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Your Cart</h2>
        <button id="closeCart" class="text-gray-500 hover:text-gray-800">✕</button>
      </div>
      <ul id="cartItems" class="space-y-2"></ul>
      <button id="removeAll" class="mt-4 bg-red-500 text-white px-3 py-2 rounded hover:bg-red-600 w-full">Remove All</button>
      <a id="checkoutBtn" href="#" target="_blank" class="mt-2 block text-center bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Checkout via Messenger</a>
    </aside>

    <div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-40 z-30"></div>
  </div>

  <script>
    const products = [
      {
        id: 1,
        name: "Solo Pack",
        price: 120,
        description: "Perfect for individual enjoyment.",
        label: "New",
        image: "/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg"
      },
      {
        id: 2,
        name: "Family Pack",
        price: 300,
        description: "Ideal for sharing with family.",
        label: "Best Seller",
        image: "/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg"
      },
      {
        id: 3,
        name: "Party Pack",
        price: 500,
        description: "For parties and gatherings.",
        label: "",
        image: "/mnt/data/517039856_747785660952752_1896212018083625161_n.jpg"
      }
    ];

    let cart = [];

    function updateCartUI() {
      const cartItems = document.getElementById("cartItems");
      const cartCount = document.getElementById("cartCount");
      cartItems.innerHTML = "";
      let count = 0;
      cart.forEach(item => {
        count += item.quantity;
        cartItems.innerHTML += `
          <li class="flex items-center justify-between">
            <span>${item.name} x${item.quantity}</span>
            <div class="flex items-center gap-1">
              <button class="text-sm bg-gray-200 px-2 rounded" onclick="changeQty(${item.id}, -1)">-</button>
              <button class="text-sm bg-gray-200 px-2 rounded" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </li>
        `;
      });
      cartCount.textContent = count;
      cartCount.classList.toggle("hidden", count === 0);

      const message = cart.map(item => `${item.name} x${item.quantity}`).join("\n");
      document.getElementById("checkoutBtn").href = `https://www.messenger.com/t/154919933362593?text=${encodeURIComponent(message)}`;
    }

    function showNotification() {
      const notification = document.getElementById("notification");
      notification.classList.remove("hidden");
      setTimeout(() => notification.classList.add("hidden"), 2000);
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        const product = products.find(p => p.id === id);
        cart.push({ id, name: product.name, quantity: 1 });
      }
      updateCartUI();
      showNotification();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    document.getElementById("productList").innerHTML = products.map(product => `
      <div class="bg-white shadow rounded-xl p-4 relative">
        <img src="${product.image}" alt="${product.name}" class="h-40 w-full object-cover rounded-md mb-2">
        ${product.label ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-1 rounded">${product.label}</span>` : ""}
        <h3 class="text-lg font-semibold">${product.name}</h3>
        <p class="text-sm text-gray-500">${product.description}</p>
        <p class="text-xl font-bold mt-2">₱${product.price}</p>
        <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 mt-2">
          <button onclick="changeQty(${product.id}, -1)" class="bg-green-500 text-white rounded-full w-8 h-8 text-sm">-</button>
          <button onclick="changeQty(${product.id}, 1)" class="bg-green-500 text-white rounded-full w-8 h-8 text-sm">+</button>
          <button onclick="addToCart(${product.id})" class="sm:ml-auto bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded">Add to Cart</button>
        </div>
      </div>
    `).join("");

    document.getElementById("cartToggle").onclick = () => {
      document.getElementById("cartSidebar").classList.remove("hidden");
      document.getElementById("overlay").classList.remove("hidden");
    };

    document.getElementById("closeCart").onclick = () => {
      document.getElementById("cartSidebar").classList.add("hidden");
      document.getElementById("overlay").classList.add("hidden");
    };

    document.getElementById("overlay").onclick = () => {
      document.getElementById("cartSidebar").classList.add("hidden");
      document.getElementById("overlay").classList.add("hidden");
    };

    document.getElementById("removeAll").onclick = () => {
      cart = [];
      updateCartUI();
    };

    // Carousel autoplay
    let index = 0;
    setInterval(() => {
      index = (index + 1) % 4;
      document.getElementById("promoCarousel").style.transform = `translateX(-${index * 100}%)`;
    }, 4000);
  </script>
</body>

</html>
