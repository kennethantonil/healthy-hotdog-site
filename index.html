<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Rental Timer System</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: white;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .pc-box {
      background: #1f1f1f;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      width: 300px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .pc-box:hover {
      transform: scale(1.03);
    }
    h2 {
      margin-bottom: 10px;
      font-size: 1.3em;
    }
    input {
      width: 90%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 1em;
    }
    button {
      background-color: #00c853;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #00a843;
    }
    .stop-btn {
      background-color: #ff5252;
      margin-left: 5px;
    }
    .stop-btn:hover {
      background-color: #e04848;
    }
    .info {
      text-align: left;
      margin-top: 15px;
      font-size: 1em;
    }
    .timer {
      font-size: 2em;
      font-weight: bold;
      color: #ff5252;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="pc-box" id="pc1">
    <h2>💻 PC 1</h2>
    <input type="text" id="name1" placeholder="Customer Name">
    <input type="number" id="amount1" placeholder="Amount (₱)" min="1">
    <div>
      <button onclick="startTimer(1)">Start</button>
      <button class="stop-btn" onclick="stopTimer(1)">Stop</button>
    </div>
    <div class="info">
      <p><b>Name:</b> <span id="displayName1">-</span></p>
      <p><b>Amount:</b> ₱<span id="displayAmount1">0</span></p>
      <p><b>Time Remaining:</b></p>
      <div class="timer" id="timeRemaining1">00:00</div>
    </div>
  </div>

  <div class="pc-box" id="pc2">
    <h2>💻 PC 2</h2>
    <input type="text" id="name2" placeholder="Customer Name">
    <input type="number" id="amount2" placeholder="Amount (₱)" min="1">
    <div>
      <button onclick="startTimer(2)">Start</button>
      <button class="stop-btn" onclick="stopTimer(2)">Stop</button>
    </div>
    <div class="info">
      <p><b>Name:</b> <span id="displayName2">-</span></p>
      <p><b>Amount:</b> ₱<span id="displayAmount2">0</span></p>
      <p><b>Time Remaining:</b></p>
      <div class="timer" id="timeRemaining2">00:00</div>
    </div>
  </div>

  <div class="pc-box" id="pc3">
    <h2>💻 PC 3</h2>
    <input type="text" id="name3" placeholder="Customer Name">
    <input type="number" id="amount3" placeholder="Amount (₱)" min="1">
    <div>
      <button onclick="startTimer(3)">Start</button>
      <button class="stop-btn" onclick="stopTimer(3)">Stop</button>
    </div>
    <div class="info">
      <p><b>Name:</b> <span id="displayName3">-</span></p>
      <p><b>Amount:</b> ₱<span id="displayAmount3">0</span></p>
      <p><b>Time Remaining:</b></p>
      <div class="timer" id="timeRemaining3">00:00</div>
    </div>
  </div>

  <div class="pc-box" id="pc4">
    <h2>💻 PC 4</h2>
    <input type="text" id="name4" placeholder="Customer Name">
    <input type="number" id="amount4" placeholder="Amount (₱)" min="1">
    <div>
      <button onclick="startTimer(4)">Start</button>
      <button class="stop-btn" onclick="stopTimer(4)">Stop</button>
    </div>
    <div class="info">
      <p><b>Name:</b> <span id="displayName4">-</span></p>
      <p><b>Amount:</b> ₱<span id="displayAmount4">0</span></p>
      <p><b>Time Remaining:</b></p>
      <div class="timer" id="timeRemaining4">00:00</div>
    </div>
  </div>

<script>
  const timers = {};

  function startTimer(pcNumber) {
    stopTimer(pcNumber);

    const name = document.getElementById(`name${pcNumber}`).value;
    const amount = parseFloat(document.getElementById(`amount${pcNumber}`).value);

    if (!name || isNaN(amount) || amount <= 0) {
      alert("Please enter a valid name and amount.");
      return;
    }

    let totalSeconds = amount * 4 * 60; // 1 peso = 4 mins

    document.getElementById(`displayName${pcNumber}`).textContent = name;
    document.getElementById(`displayAmount${pcNumber}`).textContent = amount.toFixed(2);

    timers[pcNumber] = setInterval(() => {
      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;
      document.getElementById(`timeRemaining${pcNumber}`).textContent =
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      if (totalSeconds <= 0) {
        clearInterval(timers[pcNumber]);
        alert(`Time is up for ${name} (PC ${pcNumber})!`);
      }
      totalSeconds--;
    }, 1000);
  }

  function stopTimer(pcNumber) {
    clearInterval(timers[pcNumber]);
  }
</script>

</body>
</html>
