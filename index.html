<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRA Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .header-img {
      width: 100%;
      max-height: 100px;
      object-fit: contain;
    }
    .product-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      height: 100%;
    }
    .product-card:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .admin-panel {
      display: none;
      background: #ffffff;
      border-radius: 10px;
    }
    .category-badge {
      font-size: 0.8rem;
    }
    @media (max-width: 768px) {
      .header-img {
        max-height: 80px;
      }
    }
  </style>
</head>
<body>

  <header class="bg-white shadow-sm p-2">
    <img src="https://i.imgur.com/oBS7M18.png" alt="Header" class="header-img">
  </header>

  <main class="container py-4">
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="Admin Email">
      <input type="password" id="password" class="form-control mt-2" placeholder="Password">
      <button onclick="login()" class="btn btn-primary mt-2 w-100">Login</button>
    </div>

    <div class="admin-panel p-3 mb-4">
      <h5 class="mb-3">Add Product</h5>
      <input type="text" id="productName" class="form-control mb-2" placeholder="Product Name">
      <input type="text" id="productImage" class="form-control mb-2" placeholder="Image URL">
      <input type="text" id="productPrice" class="form-control mb-2" placeholder="Price">
      <select id="productCategory" class="form-control mb-2">
        <option value="New">New</option>
        <option value="Best Sellers">Best Sellers</option>
        <option value="Discounted">Discounted</option>
      </select>
      <button onclick="addProduct()" class="btn btn-success w-100">Add Product</button>
    </div>

    <div id="productList" class="row g-3"></div>

    <hr class="my-4">
    <h3>LIVE SELLING</h3>
    <div class="ratio ratio-16x9">
      <iframe src="https://www.youtube.com/embed/live_stream?channel=UCyOC-AGduy7Z7kZep9zkFhw" frameborder="0" allowfullscreen></iframe>
    </div>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWooMw5-vQxovPjVuIkHbJVlCR8iIp2pI",
      authDomain: "kra-shop-d05f3.firebaseapp.com",
      projectId: "kra-shop-d05f3",
      storageBucket: "kra-shop-d05f3.appspot.com",
      messagingSenderId: "377788922175",
      appId: "1:377788922175:web:6b3b61362d9f73da2f3b8a"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const productList = document.getElementById('productList');
    const adminPanel = document.querySelector('.admin-panel');

    function renderProduct(doc) {
      const data = doc.data();
      const col = document.createElement('div');
      col.className = 'col-12 col-sm-6 col-md-4';
      col.innerHTML = `
        <div class="card product-card h-100">
          <img src="${data.image}" class="card-img-top" style="object-fit:cover; height:200px">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">${data.name}</h5>
            <p class="card-text text-muted">₱${data.price}</p>
            <span class="badge bg-secondary category-badge mb-2">${data.category}</span>
            <a href="https://m.me/krastoriesph" target="_blank" class="btn btn-primary mt-auto">Buy on Messenger</a>
            <button class="btn btn-outline-danger btn-sm mt-2" onclick="deleteProduct('${doc.id}')">Delete</button>
          </div>
        </div>
      `;
      productList.appendChild(col);
    }

    function getProducts() {
      productList.innerHTML = '';
      db.collection('products').onSnapshot(snapshot => {
        productList.innerHTML = '';
        snapshot.docs.forEach(doc => renderProduct(doc));
      });
    }

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          adminPanel.style.display = 'block';
        })
        .catch(err => {
          alert("Login Failed: " + err.message);
        });
    }

    function addProduct() {
      const name = document.getElementById('productName').value;
      const image = document.getElementById('productImage').value;
      const price = document.getElementById('productPrice').value;
      const category = document.getElementById('productCategory').value;
      db.collection('products').add({ name, image, price, category });
    }

    function deleteProduct(id) {
      db.collection('products').doc(id).delete();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        adminPanel.style.display = 'block';
      }
      getProducts();
    });
  </script>
</body>
</html>
