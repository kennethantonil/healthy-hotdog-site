<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💻 PC Rental Timer System</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #101010, #000);
      color: #f5f5f5;
      margin: 0;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 2em;
      font-weight: bold;
      color: #00e676;
      text-shadow: 0 0 10px #00e676;
    }

    .dashboard {
      background: #1b1b1b;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
    }

    .dashboard-item {
      background: #212121;
      padding: 15px 25px;
      border-radius: 15px;
      flex: 1 1 200px;
      min-width: 200px;
      text-align: center;
    }

    .dashboard-item h2 {
      font-size: 1.2em;
      color: #aaa;
      margin-bottom: 5px;
    }

    .dashboard .value {
      font-size: 1.8em;
      font-weight: bold;
      color: #00e676;
    }

    #pcs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .pc-box {
      background: #1f1f1f;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      width: 320px;
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.3s;
    }

    .pc-box:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px #00e67640;
    }

    .timer-bar {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }

    .timer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00e676, #ff5252);
      transition: width 1s linear;
    }

    input {
      width: 90%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 1em;
    }

    button {
      background-color: #00c853;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }

    button:hover { background-color: #00a843; }
    .stop-btn { background-color: #ff5252; }
    .stop-btn:hover { background-color: #e04848; }
    .restart-btn { background-color: #2979ff; }
    .restart-btn:hover { background-color: #1565c0; }
    .addtime-btn { background-color: #ffb300; }
    .addtime-btn:hover { background-color: #ffa000; }
    .info { text-align: left; margin-top: 15px; font-size: 1em; }
    .timer { font-size: 1.8em; font-weight: bold; color: #ff5252; margin-top: 10px; }
    #resetBtn, #exportBtn { background-color: #444; margin-top: 10px; }
    #resetBtn:hover, #exportBtn:hover { background-color: #666; }
  </style>
</head>
<body>
  <h1>💻 PC RENTAL TIMER SYSTEM</h1>

  <div class="dashboard">
    <div class="dashboard-item">
      <h2>🖥️ Active PCs</h2>
      <div class="value" id="activePCs">0</div>
    </div>
    <div class="dashboard-item">
      <h2>💰 Total Earnings</h2>
      <div class="value" id="totalEarnings">₱0.00</div>
    </div>
    <div class="dashboard-item">
      <h2>🕒 Current Time</h2>
      <div class="value" id="dashboardTime">--:--:--</div>
    </div>
    <div class="dashboard-item">
      <button id="resetBtn" onclick="resetAll()">♻ Reset All</button>
      <button id="exportBtn" onclick="exportLogs()">📤 Export Logs</button>
    </div>
  </div>

  <div id="pcs"></div>

  <script>
    const pcCount = 4;
    const RATE = 5;            // ₱5 per session
    const MINUTES_PER_RATE = 20;
    const alertSound = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");

    let totalEarnings = 0;
    const timers = {};
    const endTimes = {};
    const logs = JSON.parse(localStorage.getItem("sessionLogs") || "[]");

    function createPCBoxes() {
      const container = document.getElementById("pcs");
      for (let i = 1; i <= pcCount; i++) {
        container.innerHTML += `
          <div class="pc-box" id="pc${i}">
            <h2>💻 PC ${i}</h2>
            <input type="text" id="name${i}" placeholder="Customer Name">
            <input type="number" id="amount${i}" placeholder="Amount (₱)" min="5" step="5">
            <div>
              <button onclick="startTimer(${i})">Start</button>
              <button class="stop-btn" onclick="stopTimer(${i})">Stop</button>
              <button class="restart-btn" onclick="restartTimer(${i})">Restart</button>
            </div>
            <input type="number" id="addAmount${i}" placeholder="Add ₱" min="5" step="5">
            <button class="addtime-btn" onclick="addTime(${i})">➕ Add Time</button>
            <div class="info">
              <p><b>Name:</b> <span id="displayName${i}">-</span></p>
              <p><b>Total Amount:</b> ₱<span id="displayAmount${i}">0</span></p>
              <p><b>Time Remaining:</b></p>
              <div class="timer" id="timeRemaining${i}">00:00</div>
              <div class="timer-bar"><div class="timer-fill" id="fill${i}"></div></div>
              <p>🕒 <small>End Time: <span id="endTime${i}">--:--:--</span></small></p>
            </div>
          </div>`;
      }
    }

    createPCBoxes();

    setInterval(() => {
      const now = new Date().toLocaleTimeString();
      document.getElementById("dashboardTime").textContent = now;
      updateDashboard();
      for (let i = 1; i <= pcCount; i++) updateDisplay(i);
    }, 1000);

    function startTimer(pc) {
      stopTimer(pc);
      const name = document.getElementById(`name${pc}`).value.trim();
      const amount = parseFloat(document.getElementById(`amount${pc}`).value);
      if (!name || isNaN(amount) || amount < RATE) return alert("Enter valid name & amount (minimum ₱5)");

      const minutes = (amount / RATE) * MINUTES_PER_RATE;
      const totalSeconds = minutes * 60;
      const end = Date.now() + totalSeconds * 1000;

      endTimes[pc] = end;
      totalEarnings += amount;

      document.getElementById(`displayName${pc}`).textContent = name;
      document.getElementById(`displayAmount${pc}`).textContent = amount.toFixed(2);
      document.getElementById(`endTime${pc}`).textContent = new Date(end).toLocaleTimeString();

      runTimer(pc);
      saveData();
    }

    function runTimer(pc) {
      clearInterval(timers[pc]);
      timers[pc] = setInterval(() => {
        const now = Date.now();
        const remaining = Math.floor((endTimes[pc] - now) / 1000);

        if (remaining <= 0) {
          clearInterval(timers[pc]);
          document.getElementById(`timeRemaining${pc}`).textContent = "00:00";
          document.getElementById(`fill${pc}`).style.width = "0%";
          alertSound.play();
          notifyUser(`PC ${pc} time is up!`);
          logs.push({
            pc,
            name: document.getElementById(`displayName${pc}`).textContent,
            amount: document.getElementById(`displayAmount${pc}`).textContent,
            end: new Date().toLocaleTimeString()
          });
          saveData();
          return;
        }

        const totalSeconds = ((parseFloat(document.getElementById(`displayAmount${pc}`).textContent) / RATE) * MINUTES_PER_RATE) * 60;
        const progress = Math.max(0, (remaining / totalSeconds) * 100);

        document.getElementById(`fill${pc}`).style.width = `${progress}%`;
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        document.getElementById(`timeRemaining${pc}`).textContent = `${m}:${s}`;
      }, 1000);
    }

    function updateDisplay(pc) {
      if (!endTimes[pc]) return;
      const remaining = Math.floor((endTimes[pc] - Date.now()) / 1000);
      if (remaining > 0) {
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        document.getElementById(`timeRemaining${pc}`).textContent = `${m}:${s}`;
      }
    }

    function addTime(pc) {
      const addAmt = parseFloat(document.getElementById(`addAmount${pc}`).value);
      if (isNaN(addAmt) || addAmt <= 0) return alert("Invalid amount");
      endTimes[pc] += (addAmt / RATE) * MINUTES_PER_RATE * 60 * 1000;
      totalEarnings += addAmt;
      const newAmt = parseFloat(document.getElementById(`displayAmount${pc}`).textContent) + addAmt;
      document.getElementById(`displayAmount${pc}`).textContent = newAmt.toFixed(2);
      document.getElementById(`addAmount${pc}`).value = "";
      document.getElementById(`endTime${pc}`).textContent = new Date(endTimes[pc]).toLocaleTimeString();
      alert(`Added ₱${addAmt.toFixed(2)} to PC ${pc}`);
      saveData();
    }

    function stopTimer(pc) {
      clearInterval(timers[pc]);
      saveData();
    }

    function restartTimer(pc) {
      if (endTimes[pc] && endTimes[pc] > Date.now()) runTimer(pc);
    }

    function updateDashboard() {
      const active = Object.values(endTimes).filter(t => t > Date.now()).length;
      document.getElementById("activePCs").textContent = active;
      document.getElementById("totalEarnings").textContent = "₱" + totalEarnings.toFixed(2);
    }

    function notifyUser(msg) {
      if (Notification.permission === "granted") new Notification("PC Timer", { body: msg });
    }
    Notification.requestPermission();

    function saveData() {
      localStorage.setItem("pcRentalData", JSON.stringify({ endTimes, totalEarnings }));
      localStorage.setItem("sessionLogs", JSON.stringify(logs));
    }

    function loadData() {
      const data = JSON.parse(localStorage.getItem("pcRentalData") || "{}");
      if (data.endTimes) {
        Object.assign(endTimes, data.endTimes);
        totalEarnings = data.totalEarnings || 0;
        for (let i = 1; i <= pcCount; i++) {
          if (endTimes[i] && endTimes[i] > Date.now()) runTimer(i);
        }
      }
    }

    function resetAll() {
      if (!confirm("Reset all data?")) return;
      localStorage.clear();
      location.reload();
    }

    function exportLogs() {
      let csv = "PC,Name,Amount,EndTime\n";
      logs.forEach(l => csv += `${l.pc},${l.name},${l.amount},${l.end}\n`);
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pc_rental_logs.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onload = loadData;
  </script>
</body>
</html>
