<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PH Lower Third — Editable (Full UI, Push-Up Ticker, Surround Glow)</title>
<style>
:root{
  --accent: #8b1b2a;
  --maroon: #6f0f1a;
  --corner: 12px;
  --headline-size: 34px;
  --ticker-size: 18px;
  --push-duration: 600; /* ms */
  --display-duration: 3000; /* ms visible per item */
  --max-width: 1600px;
  --panel-padding: 18px 22px;
  --glow-alpha: 0.12;
}

/* base */
html,body{height:100%;margin:0;background:transparent;font-family:Inter, system-ui, Roboto, Arial, sans-serif;color:#fff}
*{box-sizing:border-box}
.stage{
  position:absolute; left:40px; bottom:28px;
  width: min(var(--max-width), calc(100% - 80px));
  display:flex; align-items:flex-start; gap:16px; pointer-events:auto;
}

/* logo */
.logo{
  width:120px; height:120px; flex-shrink:0;
  border-radius: calc(var(--corner) * 0.8);
  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(245,245,245,0.86));
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  border:3px solid rgba(255,255,255,0.6);
  box-shadow: 0 8px 28px rgba(111,15,26,0.18), inset 0 -3px 8px rgba(0,0,0,0.06);
}
.logo img{max-width:100%; max-height:100%; object-fit:contain; display:block}
.logo .txt{font-weight:800; color:var(--maroon); font-size:20px}

/* main column */
.main{display:flex; flex-direction:column; gap:10px; width:100%}

/* headline bar */
.headlineBar{
  display:flex; align-items:center; gap:14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
  backdrop-filter: blur(8px) saturate(120%); -webkit-backdrop-filter: blur(8px) saturate(120%);
  border-radius: var(--corner); padding: var(--panel-padding);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 18px 48px rgba(0,0,0,0.32);
  position:relative; overflow:visible;
}

/* accent strip */
.accentStrip{
  width:14px; height:72px; border-radius:6px;
  background: linear-gradient(180deg, var(--accent), var(--maroon));
  box-shadow: 0 12px 28px rgba(139,27,42,0.28);
  flex-shrink:0;
}

/* headline text */
.headlineWrap{display:flex; flex-direction:column}
.headlineText{
  font-weight:900; font-size:var(--headline-size); color:#fff; white-space:nowrap;
  text-shadow: 0 4px 14px rgba(0,0,0,0.45); display:inline-block;
}
.headlineSub{font-size:13px; color:rgba(255,255,255,0.92); margin-top:5px; white-space:nowrap}

/* surround glow (Glow Type B) */
.headlineBar::after{
  content:""; position:absolute; inset:-6px; border-radius: calc(var(--corner) + 6px); pointer-events:none;
  box-shadow: 0 0 40px rgba(139,27,42,var(--glow-alpha)), 0 8px 40px rgba(111,15,26,0.06);
  mix-blend-mode: screen;
  opacity:0.95;
}

/* ticker box (separate) */
.tickerBox{
  display:flex; align-items:center; gap:12px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border-radius: calc(var(--corner) * 0.75); padding:10px 12px; border:1px solid rgba(255,255,255,0.06);
  min-height: calc(var(--ticker-size) + 18px); overflow:visible; position:relative;
}

/* ticker label */
.tickerLabel{min-width:120px; font-weight:800; font-size:14px; text-transform:uppercase; color:rgba(255,255,255,0.95); display:flex; align-items:center; gap:8px; flex-shrink:0}
.tickerLabel .dot{width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:0 6px 14px rgba(139,27,42,0.25)}

/* ticker viewport and masked area */
.tickerViewport{position:relative; flex:1; height: calc(var(--ticker-size) + 6px); overflow:hidden}
.tickerInner{
  position:absolute; left:0; right:0; top:0;
  display:flex; flex-direction:column;
  transform: translateY(0);
  will-change: transform;
}

/* single ticker line item (stacked vertically) */
.tickerItem{
  height: calc(var(--ticker-size) + 2px);
  line-height: calc(var(--ticker-size) + 2px);
  font-size: var(--ticker-size); font-weight:700; color:#fff;
  white-space:nowrap; padding-right:30px;
  text-shadow: 0 1px 6px rgba(0,0,0,0.45);
}

/* controls UI (OBS Interact) */
.gear{position:absolute; right:18px; top:-56px; background:rgba(255,255,255,0.06); width:44px; height:44px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:999}
.controls{position:absolute; right:18px; top:-520px; width:520px; background:rgba(10,10,10,0.86); border-radius:10px; padding:12px; color:#fff; box-shadow:0 12px 36px rgba(0,0,0,0.6); z-index:998; display:none}
.controls h4{margin:0 0 8px 0; font-size:14px}
.ctrl-row{display:flex; gap:8px; align-items:center; margin-bottom:8px}
.ctrl-row label{width:150px; font-size:13px; color:rgba(255,255,255,0.92)}
.ctrl-row input, .ctrl-row textarea, .ctrl-row select{flex:1; padding:8px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.02); color:#fff}
textarea{min-height:100px; resize:vertical}
button{padding:8px 10px; border-radius:8px; border:0; background:var(--maroon); color:#fff; cursor:pointer}

/* small helper */
.controls .small {font-size:12px; opacity:0.9; margin-top:6px}

/* responsive */
@media (max-width:1000px){
  :root{ --headline-size:26px; --ticker-size:16px }
  .logo{width:92px;height:92px}
  .controls{top:-640px; width:420px}
}
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="Lower third stage">
  <div class="logo" id="logo">
    <img id="logoImg" src="" alt="" style="display:none" />
    <div class="txt" id="logoTxt">NEWS</div>
  </div>

  <div class="main">
    <div class="headlineBar" id="headlineBar" role="region" aria-label="Headline">
      <div class="accentStrip" id="accentStrip"></div>
      <div class="headlineWrap">
        <div class="headlineText" id="headlineText">BREAKING: SAMPLE LONG PHILIPPINE-STYLE HEADLINE</div>
        <div class="headlineSub" id="headlineSub" style="display:none">Optional subheadline/location</div>
      </div>
    </div>

    <div class="tickerBox" id="tickerBox" role="region" aria-label="Ticker">
      <div class="tickerLabel"><div class="dot"></div><div>Latest</div></div>
      <div class="tickerViewport" id="tickerViewport">
        <div class="tickerInner" id="tickerInner">
          <!-- .tickerItem elements injected here -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- gear + controls -->
<div class="gear" id="gear" title="Toggle Controls">⚙️</div>
<div class="controls" id="controls" aria-hidden="true" role="dialog" aria-label="Lower third controls">
  <h4>Lower-Third Controls</h4>

  <div class="ctrl-row"><label>Logo Image URL</label><input id="logoUrl" type="url" placeholder="file:///C:/logo.png or http://..." /></div>
  <div class="ctrl-row"><label>Logo Text</label><input id="logoTxtInput" type="text" placeholder="NEWS" /></div>

  <div class="ctrl-row"><label>Headline</label><input id="headlineInput" type="text" placeholder="BREAKING: ..." /></div>
  <div class="ctrl-row"><label>Subheadline</label><input id="subInput" type="text" placeholder="Optional subheadline" /></div>

  <div class="ctrl-row" style="align-items:flex-start"><label>Ticker Lines</label><textarea id="tickerInput" placeholder="One headline per line (Enter)"></textarea></div>

  <div class="ctrl-row"><label>Accent Color</label><input id="accentInput" type="color" value="#8b1b2a" /></div>
  <div class="ctrl-row"><label>Corner Radius</label><input id="cornerRadius" type="number" min="0" max="40" value="12" /></div>

  <div class="ctrl-row"><label>Headline Size</label><input id="headlineSize" type="number" min="14" max="60" value="34" /></div>
  <div class="ctrl-row"><label>Ticker Size</label><input id="tickerSize" type="number" min="10" max="30" value="18" /></div>

  <div class="ctrl-row"><label>Push Duration (ms)</label><input id="pushDuration" type="number" min="100" max="2000" value="600" /></div>
  <div class="ctrl-row"><label>Display (ms)</label><input id="displayDuration" type="number" min="500" max="20000" value="3000" /></div>

  <div class="ctrl-row"><label>Show Ticker</label>
    <select id="showTicker"><option value="1" selected>On</option><option value="0">Off</option></select>
  </div>

  <div class="ctrl-row" style="gap:8px">
    <button id="applyBtn" title="Apply changes without saving">Apply</button>
    <button id="saveBtn" title="Save to local machine (persist across sessions)">Save</button>
    <button id="resetBtn" style="background:rgba(255,255,255,0.06)">Reset</button>
  </div>

  <div class="ctrl-row" style="gap:8px">
    <button id="exportBtn" style="background:rgba(255,255,255,0.06);color:#fff">Export JSON</button>
    <input id="importFile" type="file" accept=".json" style="flex:1"/>
  </div>

  <div class="small">Tip: In OBS open Browser Source → Interact → click the ⚙️ to open this panel. Use file:/// path for local logos. Press <kbd>Ctrl/Cmd+S</kbd> to Save.</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // Elements
  const logo = $('logo'), logoImg = $('logoImg'), logoTxtEl = $('logoTxt');
  const logoUrlInput = $('logoUrl'), logoTxtInput = $('logoTxtInput');
  const headlineText = $('headlineText'), headlineInput = $('headlineInput'), headlineSub = $('headlineSub'), subInput = $('subInput');
  const tickerInput = $('tickerInput'), tickerInner = $('tickerInner'), tickerViewport = $('tickerViewport');
  const accentInput = $('accentInput'), accentStrip = $('accentStrip');
  const headlineSizeEl = $('headlineSize'), tickerSizeEl = $('tickerSize');
  const pushDurationEl = $('pushDuration'), displayDurationEl = $('displayDuration');
  const showTickerSel = $('showTicker');
  const applyBtn = $('applyBtn'), saveBtn = $('saveBtn'), resetBtn = $('resetBtn');
  const gear = $('gear'), controls = $('controls'), exportBtn = $('exportBtn'), importFile = $('importFile');
  const headlineBar = $('headlineBar'), tickerBox = $('tickerBox');
  const cornerRadiusInput = $('cornerRadius');

  // Storage key & defaults
  const STORAGE_KEY = 'ph_lt_final_ui_v2';
  const defaults = {
    logoUrl: '',
    logoTxt: 'NEWS',
    headline: 'BREAKING: SAMPLE LONG PHILIPPINE-STYLE HEADLINE',
    sub: '',
    tickerLines: ['Ticker sample 1 — details', 'Ticker sample 2 — more', 'Ticker sample 3 — update'],
    accent: '#8b1b2a',
    cornerRadius: 12,
    headlineSize: 34,
    tickerSize: 18,
    pushDuration: 600,
    displayDuration: 3000,
    showTicker: '1'
  };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? {...defaults, ...JSON.parse(raw)} : {...defaults};
    } catch(e){ return {...defaults}; }
  }
  function saveState(s){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e){}
  }

  let state = loadState();

  // Utility functions
  function shadeHex(hex, amt){
    hex = (hex||'#000').replace('#','');
    if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
    const num = parseInt(hex,16);
    let r=(num>>16)+amt, g=(num>>8 & 0x00FF)+amt, b=(num & 0x0000FF)+amt;
    r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  // Apply state to DOM (without saving)
  function applyStateToDOM(s){
    // logo
    logoUrlInput.value = s.logoUrl || '';
    logoTxtInput.value = s.logoTxt || defaults.logoTxt;
    if(s.logoUrl){
      logoImg.src = s.logoUrl;
      logoImg.style.display = 'block';
      logoTxtEl.style.display = 'none';
    } else {
      logoImg.style.display = 'none';
      logoTxtEl.style.display = 'block';
      logoTxtEl.innerText = s.logoTxt || '';
    }

    // headline
    headlineInput.value = s.headline || '';
    headlineText.innerText = s.headline || '';
    subInput.value = s.sub || '';
    headlineSub.innerText = s.sub || '';
    headlineSub.style.display = s.sub ? 'block' : 'none';

    // ticker
    tickerInput.value = (s.tickerLines||[]).join('\n');

    // style values
    accentInput.value = s.accent || defaults.accent;
    document.documentElement.style.setProperty('--accent', accentInput.value);
    document.documentElement.style.setProperty('--maroon', shadeHex(accentInput.value, -34));
    accentStrip.style.background = `linear-gradient(180deg, ${accentInput.value}, ${shadeHex(accentInput.value,-18)})`;

    cornerRadiusInput.value = s.cornerRadius || defaults.cornerRadius;
    document.documentElement.style.setProperty('--corner', (s.cornerRadius || defaults.cornerRadius) + 'px');

    headlineSizeEl.value = s.headlineSize || defaults.headlineSize;
    document.documentElement.style.setProperty('--headline-size', (s.headlineSize || defaults.headlineSize) + 'px');

    tickerSizeEl.value = s.tickerSize || defaults.tickerSize;
    document.documentElement.style.setProperty('--ticker-size', (s.tickerSize || defaults.tickerSize) + 'px');

    pushDurationEl.value = s.pushDuration || defaults.pushDuration;
    displayDurationEl.value = s.displayDuration || defaults.displayDuration;

    showTickerSel.value = s.showTicker || '1';
    tickerBox.style.display = showTickerSel.value === '1' ? 'flex' : 'none';

    buildTickerDOM();
    adjustWidth();
  }

  // Build ticker items
  function buildTickerDOM(){
    while(tickerInner.firstChild) tickerInner.removeChild(tickerInner.firstChild);
    const lines = (tickerInput.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    const items = lines.length ? lines : state.tickerLines;
    items.forEach(t=>{
      const d = document.createElement('div');
      d.className = 'tickerItem';
      d.innerText = t;
      tickerInner.appendChild(d);
    });
    // reset transform and start
    tickerInner.style.transition = 'none';
    tickerInner.style.transform = 'translateY(0)';
    ensureTickerHeights();
    startTickerLoop();
  }

  // Ticker push loop
  let tickerTimer = null;
  function startTickerLoop(){
    stopTickerLoop();
    const items = Array.from(tickerInner.children);
    if(items.length <= 1) return;
    const pushMs = parseInt(pushDurationEl.value,10) || defaults.pushDuration;
    const displayMs = parseInt(displayDurationEl.value,10) || defaults.displayDuration;

    function scheduleNext(){
      tickerTimer = setTimeout(()=>{
        // compute first item height
        const first = tickerInner.children[0];
        if(!first) return scheduleNext();
        const itemH = Math.ceil(first.getBoundingClientRect().height);
        // animate translateY
        tickerInner.style.transition = `transform ${pushMs}ms cubic-bezier(.2,.95,.2,1)`;
        tickerInner.style.transform = `translateY(-${itemH}px)`;
        // after animation, move first to end and reset
        setTimeout(()=>{
          tickerInner.style.transition = 'none';
          tickerInner.appendChild(tickerInner.children[0]);
          tickerInner.style.transform = `translateY(0)`;
          // small delay to avoid visual glitch
          setTimeout(scheduleNext, 50);
        }, pushMs + 10);
      }, displayMs);
    }
    // start
    scheduleNext();
  }
  function stopTickerLoop(){ if(tickerTimer){ clearTimeout(tickerTimer); tickerTimer = null; } }

  // Make viewport height equal to a single item
  function ensureTickerHeights(){
    const first = tickerInner.children[0];
    if(!first) return;
    const h = Math.ceil(first.getBoundingClientRect().height);
    tickerViewport.style.height = (h) + 'px';
  }

  // Auto-width to fit longest headline or ticker item
  function adjustWidth(){
    // measure headline width
    const tmp = document.createElement('span');
    tmp.style.visibility='hidden'; tmp.style.position='absolute'; tmp.style.whiteSpace='nowrap';
    tmp.style.fontWeight='900'; tmp.style.fontSize = (headlineSizeEl.value||34) + 'px';
    tmp.innerText = headlineText.innerText || '';
    document.body.appendChild(tmp);
    const headW = tmp.getBoundingClientRect().width; tmp.remove();

    // longest ticker item
    let maxTickerW = 0;
    Array.from(tickerInner.children).forEach(it=>{
      const ttmp = document.createElement('span');
      ttmp.style.visibility='hidden'; ttmp.style.position='absolute'; ttmp.style.whiteSpace='nowrap';
      ttmp.style.fontSize = (tickerSizeEl.value||18) + 'px'; ttmp.style.fontWeight='700';
      ttmp.innerText = it.innerText;
      document.body.appendChild(ttmp);
      const w = ttmp.getBoundingClientRect().width; ttmp.remove();
      if(w > maxTickerW) maxTickerW = w;
    });

    const desired = Math.min(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--max-width')) || 1600,
                     Math.max(headW + 380, maxTickerW + 320, 520));
    headlineBar.style.width = desired + 'px';
  }

  // UI wiring
  gear.addEventListener('click', ()=> {
    const show = controls.style.display !== 'block';
    controls.style.display = show ? 'block' : 'none';
    controls.setAttribute('aria-hidden', show ? 'false' : 'true');
  });

  // Input events that only apply to DOM live (not saved until Save pressed)
  headlineInput.addEventListener('input', ()=> { headlineText.innerText = headlineInput.value; adjustWidth(); });
  subInput.addEventListener('input', ()=> { headlineSub.innerText = subInput.value; headlineSub.style.display = subInput.value ? 'block' : 'none'; });
  logoTxtInput.addEventListener('input', ()=> { if(!logoUrlInput.value) logoTxtEl.innerText = logoTxtInput.value; });
  logoUrlInput.addEventListener('input', ()=> {
    const v = logoUrlInput.value.trim();
    if(v){ logoImg.src = v; logoImg.style.display = 'block'; logoTxtEl.style.display = 'none'; } else { logoImg.style.display='none'; logoTxtEl.style.display='block'; }
  });
  accentInput.addEventListener('input', ()=> {
    document.documentElement.style.setProperty('--accent', accentInput.value);
    document.documentElement.style.setProperty('--maroon', shadeHex(accentInput.value,-34));
    accentStrip.style.background = `linear-gradient(180deg, ${accentInput.value}, ${shadeHex(accentInput.value,-18)})`;
  });
  cornerRadiusInput.addEventListener('input', ()=> {
    const v = Number(cornerRadiusInput.value) || defaults.cornerRadius;
    document.documentElement.style.setProperty('--corner', v + 'px');
  });
  headlineSizeEl.addEventListener('input', ()=> {
    const v = Number(headlineSizeEl.value) || defaults.headlineSize;
    document.documentElement.style.setProperty('--headline-size', v + 'px');
    adjustWidth();
  });
  tickerSizeEl.addEventListener('input', ()=> {
    const v = Number(tickerSizeEl.value) || defaults.tickerSize;
    document.documentElement.style.setProperty('--ticker-size', v + 'px');
    // rebuild so heights align
    buildTickerDOM();
    adjustWidth();
  });

  // Apply: apply changes (live) but don't persist
  applyBtn.addEventListener('click', ()=>{
    // update transient state from inputs (but don't save)
    const tmpState = {
      ...state,
      logoUrl: logoUrlInput.value.trim(),
      logoTxt: logoTxtInput.value.trim(),
      headline: headlineInput.value,
      sub: subInput.value,
      tickerLines: (tickerInput.value||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean),
      accent: accentInput.value,
      cornerRadius: Number(cornerRadiusInput.value) || defaults.cornerRadius,
      headlineSize: Number(headlineSizeEl.value) || defaults.headlineSize,
      tickerSize: Number(tickerSizeEl.value) || defaults.tickerSize,
      pushDuration: Number(pushDurationEl.value) || defaults.pushDuration,
      displayDuration: Number(displayDurationEl.value) || defaults.displayDuration,
      showTicker: showTickerSel.value
    };
    state = {...state, ...tmpState}; // update runtime state
    applyStateToDOM(state);
  });

  // Save: persist and apply
  saveBtn.addEventListener('click', ()=>{
    state.logoUrl = logoUrlInput.value.trim();
    state.logoTxt = logoTxtInput.value.trim() || defaults.logoTxt;
    state.headline = headlineInput.value.trim() || defaults.headline;
    state.sub = subInput.value.trim() || '';
    state.tickerLines = (tickerInput.value||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean) || defaults.tickerLines;
    state.accent = accentInput.value;
    state.cornerRadius = Number(cornerRadiusInput.value) || defaults.cornerRadius;
    state.headlineSize = Number(headlineSizeEl.value) || defaults.headlineSize;
    state.tickerSize = Number(tickerSizeEl.value) || defaults.tickerSize;
    state.pushDuration = Number(pushDurationEl.value) || defaults.pushDuration;
    state.displayDuration = Number(displayDurationEl.value) || defaults.displayDuration;
    state.showTicker = showTickerSel.value;
    saveState(state);
    applyStateToDOM(state);
    saveBtn.innerText = 'Saved ✔';
    setTimeout(()=> saveBtn.innerText = 'Save', 900);
  });

  // Reset
  resetBtn.addEventListener('click', ()=>{
    localStorage.removeItem(STORAGE_KEY);
    state = {...defaults};
    applyStateToDOM(state);
  });

  // Export / Import
  exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'lowerthird-settings.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  importFile.addEventListener('change', (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const parsed = JSON.parse(r.result);
        state = {...defaults, ...parsed};
        saveState(state);
        applyStateToDOM(state);
        alert('Imported settings applied.');
      } catch(err){
        alert('Invalid JSON file.');
      }
    };
    r.readAsText(f);
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
      e.preventDefault();
      saveBtn.click();
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){
      e.preventDefault();
      applyBtn.click();
    }
  });

  // URL params quick API: ?headline=...&logo=...&ticker=Line1|Line2
  (function applyURLParams(){
    try{
      const p = new URLSearchParams(location.search);
      const tmp = {};
      if(p.has('headline')) tmp.headline = p.get('headline');
      if(p.has('logo')){
        const v = p.get('logo');
        if(v.startsWith('http') || v.startsWith('file://')) tmp.logoUrl = v; else tmp.logoTxt = v;
      }
      if(p.has('ticker')) tmp.tickerLines = p.get('ticker').split('|').map(s=>s.trim()).filter(Boolean);
      state = {...state, ...tmp};
      // do not auto-save; just apply
      applyStateToDOM(state);
    }catch(e){}
  })();

  // Start/Stop ticker on visibility change
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) stopTickerLoop(); else startTickerLoopIfNeeded();
  });

  // Start ticker if needed
  function startTickerLoopIfNeeded(){ if(tickerInner.children.length>1) startTickerLoop(); }

  // Initialize
  state = {...defaults, ...state};
  applyStateToDOM(state);

  // adjust on resize (and observe headlineBar)
  window.addEventListener('resize', ()=>{ ensureTickerHeights(); adjustWidth(); });
  new ResizeObserver(()=> { ensureTickerHeights(); adjustWidth(); }).observe(headlineBar);

  // small helpers
  function ensureTickerHeights(){
    const first = tickerInner.children[0];
    if(!first) return;
    const h = Math.ceil(first.getBoundingClientRect().height);
    tickerViewport.style.height = h + 'px';
  }

  // Start loop
  function startTickerLoop(){
    // wrapper will rebuild if needed
    const lines = tickerInner.children.length;
    if(lines <= 1) return;
    // ensure consistent sizes
    ensureTickerHeights();
    // use existing loop logic from buildTickerDOM
    // (startTickerLoop is already defined above as used by buildTickerDOM)
    // implemented in buildTickerDOM via startTickerLoop call - below ensure it's running
    stopTickerLoop();
    // trigger the loop by calling buildTickerDOM (which schedules)
    // but we want no duplication - schedule directly:
    const pushMs = Number(pushDurationEl.value) || defaults.pushDuration;
    const displayMs = Number(displayDurationEl.value) || defaults.displayDuration;

    function scheduleNext(){
      tickerTimer = setTimeout(()=>{
        const first = tickerInner.children[0];
        if(!first) return scheduleNext();
        const itemH = Math.ceil(first.getBoundingClientRect().height);
        tickerInner.style.transition = `transform ${pushMs}ms cubic-bezier(.2,.95,.2,1)`;
        tickerInner.style.transform = `translateY(-${itemH}px)`;
        setTimeout(()=>{
          tickerInner.style.transition = 'none';
          tickerInner.appendChild(tickerInner.children[0]);
          tickerInner.style.transform = 'translateY(0)';
          setTimeout(scheduleNext, 50);
        }, pushMs + 10);
      }, displayMs);
    }
    scheduleNext();
  }
  function stopTickerLoop(){ if(tickerTimer){ clearTimeout(tickerTimer); tickerTimer=null; } }

  // small poly: ensure loop restarts on buildTickerDOM
  function startTickerLoop(){ startTickerLoopIfNeeded(); }

})();
</script>
</body>
