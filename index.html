<!DOCTYPE html>
<html lang="en">
<head>
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthy White Hotdog</title>
  <link rel="icon" href="https://i.imgur.com/V1jYKko.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  ...
</head>

  <style>
    :root {
      --bg-light: #f4f4f4;
      --bg-dark: #1a1a1a;
      --text-light: #333;
      --text-dark: #fff;
      --primary: #ff5e5e;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-light);
      color: var(--text-light);
      transition: background 0.3s, color 0.3s;
    }
    .dark-mode {
      background: var(--bg-dark);
      color: var(--text-dark);
    }
    header {
      background-color: #fff;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .dark-mode header {
      background-color: #2a2a2a;
    }
    .logo-img {
      max-height: 60px;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      background: #eee;
      padding: 10px;
      flex-wrap: wrap;
    }
    .dark-mode nav {
      background: #333;
    }
    nav button {
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      transition: background 0.3s;
    }
    nav button:hover {
      background: #e14e4e;
    }
    section {
      padding: 20px;
      animation: fadeIn 0.5s ease-in;
    }
    .card {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 15px auto;
      border-radius: 10px;
      background: #fff;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    .dark-mode .card {
      background: #2a2a2a;
      border: 1px solid #444;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
      width: 100%;
      border-radius: 10px;
    }
    .quantity-input {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin: 10px 0;
    }
    .quantity-input input {
      width: 50px;
      text-align: center;
    }
    #cart-items li {
      margin: 10px 0;
      list-style: none;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .dark-mode #cart-items li {
      background: #2a2a2a;
    }
    .remove-item {
      background: red;
      color: #fff;
      border: none;
      padding: 5px 10px;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    .payment-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    .payment-buttons button {
      display: flex;
      align-items: center;
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    .dark-mode .payment-buttons button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
    }
    .payment-buttons button:hover {
      transform: scale(1.05);
    }
    .payment-buttons img {
      width: 24px;
      height: 24px;
      margin-right: 8px;
    }
    input[type="text"], input[type="number"] {
      display: block;
      margin: 5px auto;
      padding: 10px;
      width: 90%;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .dark-mode input {
      background: #2a2a2a;
      color: white;
      border: 1px solid #555;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #ddd;
      margin-top: 40px;
    }
    .dark-mode footer {
      background: #222;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://i.imgur.com/oBS7M18.png" alt="Healthy White Hotdog Logo" class="logo-img" />
  </header>

  <nav>
    <button onclick="showSection('homepage')">
  <img src="https://i.imgur.com/V1jYKko.png" alt="Home" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;">
</button>

    <button onclick="showSection('products')">
  <img src="https://i.imgur.com/bsLtkVk.png" alt="Products" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;">
</button>

    <button onclick="showSection('cart')">🛒 Cart (<span id="cart-count">0</span>)</button>
    <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
  </nav>

  <section id="homepage" style="display: block; text-align: center;">
    <h1>Welcome to Healthy White Hotdog!</h1>
    <p>Delicious and guilt-free hotdog packs for every occasion 🍴</p>
    <button onclick="showSection('products')">Explore Packs</button>
  </section>

  <section id="products" style="display:none;">
    <div class="card">
      <img src="https://i.imgur.com/Kg68IWo.jpeg" alt="Solo Pack">
      <h3>Solo Pack</h3>
      <p>₱50</p>
      <div class="quantity-input">
        <button onclick="changeQuantity('qty-solo', -1)">-</button>
        <input type="number" id="qty-solo" value="1" readonly>
        <button onclick="changeQuantity('qty-solo', 1)">+</button>
      </div>
      <button onclick="addToCart('Solo Pack', 50, 'https://i.imgur.com/Kg68IWo.jpeg', parseInt(document.getElementById('qty-solo').value))">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/vzDJzkV.jpeg" alt="Family Pack">
      <h3>Family Pack</h3>
      <p>₱180</p>
      <div class="quantity-input">
        <button onclick="changeQuantity('qty-family', -1)">-</button>
        <input type="number" id="qty-family" value="1" readonly>
        <button onclick="changeQuantity('qty-family', 1)">+</button>
      </div>
      <button onclick="addToCart('Family Pack', 180, 'https://i.imgur.com/vzDJzkV.jpeg', parseInt(document.getElementById('qty-family').value))">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/V3eQP4i.jpeg" alt="Party Pack">
      <h3>Party Pack</h3>
      <p>₱350</p>
      <div class="quantity-input">
        <button onclick="changeQuantity('qty-party', -1)">-</button>
        <input type="number" id="qty-party" value="1" readonly>
        <button onclick="changeQuantity('qty-party', 1)">+</button>
      </div>
      <button onclick="addToCart('Party Pack', 350, 'https://i.imgur.com/V3eQP4i.jpeg', parseInt(document.getElementById('qty-party').value))">Add to Cart</button>
    </div>
  </section>

  <section id="cart" style="display:none;">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <input type="text" id="voucher-input" placeholder="Enter voucher code" oninput="applyVoucher()" />
    <div id="voucher-message"></div>
    <div id="total">Total: ₱0</div>

    <h3>Customer Info</h3>
    <input type="text" id="customer-name" placeholder="Your Name" />
    <input type="text" id="customer-address" placeholder="Delivery Address" />
    <input type="text" id="customer-contact" placeholder="Contact Number" />

    <h3>Select Payment Method</h3>
    <div class="payment-buttons">
      <button onclick="checkout('messenger')">
        <img src="https://i.imgur.com/KC8nrKz.png" alt="Messenger Icon"> Messenger
      </button>
      <button onclick="checkout('cod')">
        <img src="https://i.imgur.com/nUaMaaX.png" alt="COD Icon"> Cash on Delivery
      </button>
      <button onclick="checkout('gcash')">
        <img src="https://i.imgur.com/83g16na.png" alt="GCash Icon"> GCash
      </button>
    </div>
  </section>

  <footer>
    &copy; 2025 Healthy White Hotdog. All rights reserved.
  </footer>

  <script>
    const cart = [];
    let discount = 0;
    let discountMessage = '';

    function changeQuantity(id, change) {
      const input = document.getElementById(id);
      let current = parseInt(input.value);
      current = Math.max(1, current + change);
      input.value = current;
    }

    function addToCart(name, price, image, quantity = 1) {
      const existing = cart.find(item => item.name === name);
      if (existing) {
        existing.quantity += quantity;
      } else {
        cart.push({ name, price, quantity, image });
      }
      renderCart();
      alert(`${name} added to cart!`);
    }

    function renderCart() {
      const cartItems = document.getElementById('cart-items');
      cartItems.innerHTML = '';
      let subtotal = 0;

      cart.forEach((item, i) => {
        subtotal += item.price * item.quantity;
        const li = document.createElement('li');
        li.innerHTML = `
          <img src="${item.image}" width="80" style="vertical-align:middle; border-radius:10px; cursor:pointer;" onclick="window.open('${item.image}', '_blank')">
          ${item.name} x${item.quantity} - ₱${(item.price * item.quantity).toFixed(2)}
          <button class="remove-item" onclick="removeFromCart(${i})">✕</button>
        `;
        cartItems.appendChild(li);
      });

      const finalTotal = Math.max(0, subtotal - discount);
      document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('total').textContent = 'Total: ₱' + finalTotal.toFixed(2);
      document.getElementById('voucher-message').textContent = discountMessage;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function applyVoucher() {
      const code = document.getElementById('voucher-input').value.trim().toUpperCase();
      const subtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);

      if (code === "HOTDOG10") {
        discount = 10;
        discountMessage = "Voucher HOTDOG10 applied: ₱10 off!";
      } else if (code === "PARTY20") {
        discount = 20;
        discountMessage = "Voucher PARTY20 applied: ₱20 off!";
      } else if (code === "SAVE10%") {
        discount = subtotal * 0.10;
        discountMessage = "Voucher SAVE10% applied: 10% off!";
      } else {
        discount = 0;
        discountMessage = "";
      }
      renderCart();
    }

    function checkout(method = 'messenger') {
      if (cart.length === 0) return alert("Your cart is empty!");

      const name = document.getElementById("customer-name")?.value || "N/A";
      const address = document.getElementById("customer-address")?.value || "N/A";
      const contact = document.getElementById("customer-contact")?.value || "N/A";

      const message = cart.map((item, i) => `${i + 1}. ${item.name} x${item.quantity}`).join('\n');
      const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0) - discount;

      const orderDetails = `Order Summary:
${message}

Name: ${name}
Address: ${address}
Contact: ${contact}
Discount: ₱${discount.toFixed(2)}
Total: ₱${total.toFixed(2)}`;

      if (method === 'messenger') {
        const link = `https://facebook.com/messages/t/YourPageName?text=${encodeURIComponent(orderDetails)}`;
        window.open(link, '_blank');
      } else if (method === 'cod') {
        alert("Your order has been placed for Cash on Delivery.\n\n" + orderDetails);
      } else if (method === 'gcash') {
        alert("Send payment to 09XXXXXXXXX (GCash)\n\nThen message us on Facebook with proof of payment.\n\n" + orderDetails);
      }
    }

    function showSection(id) {
      ['homepage', 'products', 'cart'].forEach(sec => {
        document.getElementById(sec).style.display = (sec === id) ? 'block' : 'none';
      });
      if (id === 'cart') renderCart();
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    window.onload = () => {
      gsap.from("section", {
        opacity: 0,
        duration: 1,
        y: 50,
        stagger: 0.3
      });
    };
  </script>
</body>
</html>
