<!-- ULTRA PRO Philippine Style Lowerthird (A+B+C+D) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Lower Third ULTRA PRO</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: "Arial Black", Arial, sans-serif;
  }

  :root {
    --theme-primary: #0038a8;
    --theme-secondary: #ce1126;
    --ticker-bg: #000;
  }

  .lowerthird {
    position: absolute;
    bottom: 0;
    width: 100%;
    transform: translateY(100%);
    animation: slideUp 0.8s ease forwards;
    display: flex;
    flex-direction: column;
  }

  .top-row {
    display: flex;
    align-items: center;
  }

  /* Breaking Bar */
  .breaking {
    background: var(--theme-secondary);
    padding: 6px 20px;
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    flex: 1;
    text-transform: uppercase;
    filter: drop-shadow(2px 2px 6px rgba(0,0,0,0.8));
  }

  /* Logo */
  .logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
    background-size: contain;
    background-repeat: no-repeat;
    margin-left: 10px;
  }

  /* Main */
  .main {
    background: linear-gradient(to right, var(--theme-primary), var(--theme-secondary));
    color: #fff;
    padding: 10px 20px;
    filter: drop-shadow(3px 3px 8px rgba(0,0,0,0.8));
    display: flex;
    align-items: center;
  }

  .flag {
    width: 55px;
    height: 32px;
    background: url('https://upload.wikimedia.org/wikipedia/commons/9/99/Flag_of_the_Philippines.svg');
    background-size: cover;
    margin-right: 14px;
  }

  .name { font-size: 28px; font-weight: bold; text-shadow: 0 0 8px rgba(0,0,0,0.9); }
  .position { font-size: 18px; opacity: 0.95; margin-top: -3px; }

  /* Time */
  .time-box {
    font-size: 18px;
    font-weight: bold;
    margin-left: auto;
  }

  /* Auto Font Scale */
  @media (max-width: 1200px) {
    .name { font-size: 22px; }
    .position { font-size: 16px; }
  }

  /* Ticker */
  .ticker-container {
    background: var(--ticker-bg);
    overflow: hidden;
    height: 40px;
    display: flex;
    align-items: center;
    filter: drop-shadow(2px 2px 6px rgba(0,0,0,0.8));
  }

  .ticker-text {
    white-space: nowrap;
    display: inline-block;
    padding-left: 100%;
    animation: ticker 12s linear infinite;
    font-size: 18px;
  }

  .paused { animation-play-state: paused !important; }

  /* Themes */
  .theme-breaking { --theme-primary:#ce1126; --theme-secondary:#000; }
  .theme-weather { --theme-primary:#0074ff; --theme-secondary:#2dd4ff; }
  .theme-live { --theme-primary:#ff0000; --theme-secondary:#770000; }
  .theme-sports { --theme-primary:#008f39; --theme-secondary:#00491c; }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="lowerthird" class="lowerthird">

  <div class="top-row">
    <div class="breaking" id="breakingText">BREAKING NEWS</div>
    <img id="logoImg" class="logo" src="" alt="" style="display:none;">
  </div>

  <div class="main">
    <div class="flag"></div>
    <div>
      <div class="name" id="nameText">JUAN DELA CRUZ</div>
      <div class="position" id="positionText">News Correspondent</div>
    </div>
    <div class="time-box" id="timeBox"></div>
  </div>

  <div class="ticker-container">
    <div class="ticker-text" id="tickerText">Scrolling ticker here... Uwan Updates • PH News • Fully Dynamic!</div>
  </div>
</div>

<script>
// ✅ Dynamic Time
function updateClock() {
  const d = new Date();
  document.getElementById('timeBox').innerText = d.toLocaleTimeString('en-PH', { hour12: true });
}
setInterval(updateClock, 1000);
updateClock();

// ✅ URL Editing
const params = new URLSearchParams(window.location.search);
function setParam(id, key) {
  if(params.has(key)) document.getElementById(id).innerText = params.get(key);
}

setParam('breakingText','breaking');
setParam('nameText','name');
setParam('positionText','position');
setParam('tickerText','ticker');

// ✅ Logo Support
if(params.has('logo')) {
  const logo = document.getElementById('logoImg');
  logo.src = params.get('logo');
  logo.style.display = 'block';
}

// ✅ Animation Control
if(params.get('animate') === 'off') {
  document.getElementById('tickerText').classList.add('paused');
}

// ✅ Theme Swap
if(params.get('theme')) {
  document.getElementById('lowerthird').classList.add('theme-' + params.get('theme'));
}
</script>

<!-- ✅ ULTRA CONTROL PANEL -->
<div id="editPanel" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); color: #fff; padding: 14px; border-radius: 12px; font-family: Arial; width: 260px; z-index:9999; cursor: move;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <h3 style="font-size:16px; margin:0;">Control Panel</h3>
    <button onclick="togglePanel()" style="background:#ce1126; border:none; color:#fff; padding:4px 6px; cursor:pointer; font-weight:bold;">✖</button>
  </div>

  <label>Breaking:</label>
  <input type="text" id="editBreaking" style="width:100%; margin-bottom:6px;"><br>

  <label>Name:</label>
  <input type="text" id="editName" style="width:100%; margin-bottom:6px;"><br>

  <label>Position:</label>
  <input type="text" id="editPosition" style="width:100%; margin-bottom:6px;"><br>

  <label>Ticker:</label>
  <input type="text" id="editTicker" style="width:100%; margin-bottom:10px;"><br>

  <button onclick="applyEdits()" style="width:100%; padding:7px; font-weight:bold; margin-bottom:10px;">✔ Apply</button>

  <!-- Theme Buttons -->
  <label>Theme:</label>
  <div style="display:flex; gap:6px; margin-bottom:10px;">
    <button onclick="setTheme('breaking')">🔴</button>
    <button onclick="setTheme('weather')">🌧️</button>
    <button onclick="setTheme('live')">📺</button>
    <button onclick="setTheme('sports')">🏆</button>
  </div>

  <!-- Animation Toggle -->
  <button onclick="toggleAnimate()" style="width:100%; padding:6px; margin-bottom:10px;">⏯ Animation</button>

  <!-- Minimize -->
  <button onclick="minimizePanel()" style="width:100%; padding:6px; background:#555; color:#fff;">➖ Minimize</button>
</div>

<style>
  #editPanel button { border:none; background:#222; color:#fff; padding:4px; border-radius:6px; cursor:pointer; }
  #editPanel button:hover { background:#444; }
</style>

<script>
// ✅ Fill defaults with saved/local or current text
function loadDefaults(){
  editBreaking.value = localStorage.getItem('breaking') || breakingText.innerText;
  editName.value = localStorage.getItem('name') || nameText.innerText;
  editPosition.value = localStorage.getItem('position') || positionText.innerText;
  editTicker.value = localStorage.getItem('ticker') || tickerText.innerText;
}
loadDefaults();

// ✅ Apply and Save
function applyEdits(){
  breakingText.innerText = editBreaking.value;
  nameText.innerText = editName.value;
  positionText.innerText = editPosition.value;
  tickerText.innerText = editTicker.value;

  localStorage.setItem('breaking', editBreaking.value);
  localStorage.setItem('name', editName.value);
  localStorage.setItem('position', editPosition.value);
  localStorage.setItem('ticker', editTicker.value);
}

// ✅ Theme Control
function setTheme(theme){
  const box = document.getElementById('lowerthird');
  box.className = 'lowerthird';
  box.classList.add('theme-' + theme);
  localStorage.setItem('theme', theme);
}
if(localStorage.getItem('theme')) setTheme(localStorage.getItem('theme'));

// ✅ Animation Pause / Resume
function toggleAnimate(){
  const t = document.getElementById('tickerText');
  t.classList.toggle('paused');
}

// ✅ Drag Panel
let offsetX, offsetY;
editPanel.onmousedown = e => {
  offsetX = e.clientX - editPanel.offsetLeft;
  offsetY = e.clientY - editPanel.offsetTop;
  document.onmousemove = e2 => {
    editPanel.style.left = (e2.clientX - offsetX) + 'px';
    editPanel.style.top = (e2.clientY - offsetY) + 'px';
  }
}
editPanel.onmouseup = ()=> document.onmousemove=null;

// ✅ Minimize
function minimizePanel(){ editPanel.style.height='28px'; editPanel.style.overflow='hidden'; }
function togglePanel(){ editPanel.style.display = editPanel.style.display==='none' ? 'block' : 'none'; }
</script>

</body>
</html>
