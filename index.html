<main id="main">
  <div class="card" style="animation: fadeIn 0.5s ease;">
    <h3>Solo Pack</h3>
    <img src="https://via.placeholder.com/300x200.png?text=Solo+Pack" alt="Solo Pack" class="product-image" />
    <p class="price">₱50</p>
    <div class="quantity-input">
      <button class="qty-btn">-</button>
      <input type="number" value="1" min="1" />
      <button class="qty-btn">+</button>
    </div>
    <button class="btn-primary">Add to Cart</button>
  </div>
  <div class="card" style="animation: fadeIn 0.5s ease 0.1s;">
    <h3>Family Pack</h3>
    <img src="https://via.placeholder.com/300x200.png?text=Family+Pack" alt="Family Pack" class="product-image" />
    <p class="price">₱120</p>
    <div class="quantity-input">
      <button class="qty-btn">-</button>
      <input type="number" value="1" min="1" />
      <button class="qty-btn">+</button>
    </div>
    <button class="btn-primary">Add to Cart</button>
  </div>
  <div class="card" style="animation: fadeIn 0.5s ease 0.2s;">
    <h3>Barkada Pack</h3>
    <img src="https://via.placeholder.com/300x200.png?text=Barkada+Pack" alt="Barkada Pack" class="product-image" />
    <p class="price">₱200</p>
    <div class="quantity-input">
      <button class="qty-btn">-</button>
      <input type="number" value="1" min="1" />
      <button class="qty-btn">+</button>
    </div>
    <button class="btn-primary">Add to Cart</button>
  </div>
</main>
