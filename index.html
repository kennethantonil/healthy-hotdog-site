<script>
  const products = [
    { name: 'Solo Pack', price: 120, label: 'New' },
    { name: 'Family Pack', price: 300, label: 'Best Seller' },
    { name: 'Party Pack', price: 500, label: '' }
  ];

  const productList = document.getElementById('productList');
  const cartItems = document.getElementById('cartItems');
  const cartSidebar = document.getElementById('cartSidebar');
  const cartToggle = document.getElementById('cartToggle');
  const cartClose = document.getElementById('cartClose');
  const cartCount = document.getElementById('cartCount');
  const cartTotal = document.getElementById('cartTotal');
  const checkoutBtn = document.getElementById('checkoutBtn');
  const popupNotification = document.getElementById('popupNotification');
  const popupBottom = document.getElementById('popupBottom');

  let cart = [];

  function renderProducts() {
    productList.innerHTML = '';
    products.forEach(product => {
      const card = document.createElement('div');
      card.className = 'bg-white p-4 rounded-xl shadow-md';
      card.innerHTML = `
        <div class="mb-2">
          ${product.label ? `<span class="text-xs text-white bg-red-500 rounded-full px-2 py-0.5">${product.label}</span>` : ''}
        </div>
        <h3 class="text-lg font-semibold mb-1">${product.name}</h3>
        <p class="mb-2 text-sm text-gray-600">₱${product.price}</p>
        <div class="flex items-center gap-1">
          <button class="qty-minus bg-gray-200 rounded-full w-8 h-8">-</button>
          <span class="qty-display">1</span>
          <button class="qty-plus bg-gray-200 rounded-full w-8 h-8">+</button>
          <button class="add-to-cart ml-2 bg-green-600 text-white px-3 py-2 rounded-lg hover:bg-green-700 transition" data-name="${product.name}" data-price="${product.price}">Add to Cart</button>
        </div>
      `;
      const qtyDisplay = card.querySelector('.qty-display');
      let quantity = 1;

      card.querySelector('.qty-minus').addEventListener('click', () => {
        if (quantity > 1) qtyDisplay.textContent = --quantity;
      });

      card.querySelector('.qty-plus').addEventListener('click', () => {
        qtyDisplay.textContent = ++quantity;
      });

      card.querySelector('.add-to-cart').addEventListener('click', () => {
        const name = product.name;
        const price = product.price;
        const existing = cart.find(item => item.name === name);
        if (existing) {
          existing.quantity += quantity;
        } else {
          cart.push({ name, price, quantity });
        }
        updateCart();
        showNotification();
      });

      productList.appendChild(card);
    });
  }

  function updateCart() {
    cartItems.innerHTML = '';
    let total = 0;
    cart.forEach((item, index) => {
      total += item.price * item.quantity;
      const row = document.createElement('div');
      row.className = 'flex justify-between items-center mb-2';
      row.innerHTML = `
        <div>
          <p class="font-semibold">${item.name}</p>
          <p class="text-sm text-gray-500">₱${item.price} x ${item.quantity}</p>
        </div>
        <div class="flex items-center gap-1">
          <button class="decrease bg-gray-200 rounded-full w-6 h-6">-</button>
          <span>${item.quantity}</span>
          <button class="increase bg-gray-200 rounded-full w-6 h-6">+</button>
        </div>
      `;
      row.querySelector('.decrease').addEventListener('click', () => {
        if (item.quantity > 1) {
          item.quantity--;
        } else {
          cart.splice(index, 1);
        }
        updateCart();
      });
      row.querySelector('.increase').addEventListener('click', () => {
        item.quantity++;
        updateCart();
      });
      cartItems.appendChild(row);
    });

    cartTotal.textContent = total;
    cartCount.textContent = cart.length;
    cartCount.classList.toggle('hidden', cart.length === 0);
  }

  function showNotification() {
    popupNotification.classList.remove('hidden');
    popupBottom.classList.remove('hidden');
    setTimeout(() => {
      popupNotification.classList.add('hidden');
      popupBottom.classList.add('hidden');
    }, 2000);
  }

  cartToggle.addEventListener('click', () => {
    cartSidebar.classList.remove('hidden');
  });

  cartClose.addEventListener('click', () => {
    cartSidebar.classList.add('hidden');
  });

  document.addEventListener('click', (e) => {
    if (!cartSidebar.contains(e.target) && !cartToggle.contains(e.target)) {
      cartSidebar.classList.add('hidden');
    }
  });

  checkoutBtn.addEventListener('click', () => {
    const name = document.getElementById('customerName').value;
    const address = document.getElementById('customerAddress').value;
    let orderDetails = cart.map(item => `${item.quantity} x ${item.name}`).join(', ');
    const message = `Hi! I'd like to order: ${orderDetails}. Name: ${name}, Address: ${address}`;
    const encoded = encodeURIComponent(message);
    window.open(`https://www.facebook.com/MommySamWhiteHotdog/messages?t=${encoded}`, '_blank');
  });

  // Auto-carousel
  let promoIndex = 0;
  setInterval(() => {
    promoIndex = (promoIndex + 1) % 4;
    document.getElementById('promoCarousel').style.transform = `translateX(-${promoIndex * 100}%)`;
  }, 4000);

  // ✅ Call this on load
  renderProducts();
</script>
