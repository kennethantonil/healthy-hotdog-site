<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Rental Timer System</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url("IMG_1856_converted.jpg") no-repeat center center fixed;
      background-size: cover;
      color: white;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      backdrop-filter: blur(2px);
    }

    .pc-box {
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 320px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease;
      overflow: hidden;
    }

    .pc-box:hover {
      transform: scale(1.03);
    }

    /* Mock monitor background */
    .pc-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("https://cdn.pixabay.com/photo/2015/05/31/10/55/computer-791276_1280.jpg") center/cover;
      opacity: 0.3;
      z-index: 0;
    }

    .pc-box * {
      position: relative;
      z-index: 1;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 1.3em;
    }

    input {
      width: 90%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 1em;
      outline: none;
    }

    button {
      background-color: #00c853;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover {
      background-color: #00a843;
    }

    .stop-btn {
      background-color: #ff5252;
      margin-left: 5px;
    }

    .stop-btn:hover {
      background-color: #e04848;
    }

    .restart-btn {
      background-color: #2979ff;
      margin-left: 5px;
    }

    .restart-btn:hover {
      background-color: #1565c0;
    }

    .addtime-btn {
      background-color: #ffb300;
      margin-left: 5px;
    }

    .addtime-btn:hover {
      background-color: #ffa000;
    }

    .info {
      text-align: left;
      margin-top: 15px;
      font-size: 1em;
    }

    .timer {
      font-size: 2em;
      font-weight: bold;
      color: #ff5252;
      text-align: center;
      margin-top: 10px;
    }

    .time-label {
      color: #ccc;
      font-size: 0.9em;
      margin-top: 8px;
    }

    .overlay {
      background: rgba(0,0,0,0.5);
      border-radius: 15px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <!-- Container for PCs -->
  <div id="pcs"></div>

<script>
  const pcCount = 4;
  const timers = {};
  const savedData = {};

  function createPCBoxes() {
    const container = document.getElementById('pcs');
    for (let i = 1; i <= pcCount; i++) {
      container.innerHTML += `
      <div class="pc-box" id="pc${i}">
        <div class="overlay">
          <h2>💻 PC ${i}</h2>
          <input type="text" id="name${i}" placeholder="Customer Name">
          <input type="number" id="amount${i}" placeholder="Amount (₱)" min="1">
          <div>
            <button onclick="startTimer(${i})">Start</button>
            <button class="stop-btn" onclick="stopTimer(${i})">Stop</button>
            <button class="restart-btn" onclick="restartTimer(${i})">Restart</button>
            <button class="addtime-btn" onclick="addTime(${i})">Add Time</button>
          </div>
          <div class="info">
            <p><b>Name:</b> <span id="displayName${i}">-</span></p>
            <p><b>Amount:</b> ₱<span id="displayAmount${i}">0</span></p>
            <p><b>Time Remaining:</b></p>
            <div class="timer" id="timeRemaining${i}">00:00</div>
            <p class="time-label">🕒 Current Time: <span id="currentTime${i}">--:--:--</span></p>
            <p class="time-label">⏰ End Time: <span id="endTime${i}">--:--:--</span></p>
          </div>
        </div>
      </div>`;
    }
  }

  createPCBoxes();

  setInterval(() => {
    const now = new Date();
    const current = now.toLocaleTimeString();
    for (let i = 1; i <= pcCount; i++) {
      document.getElementById(`currentTime${i}`).textContent = current;
    }
  }, 1000);

  function startTimer(pcNumber) {
    stopTimer(pcNumber);

    const name = document.getElementById(`name${pcNumber}`).value;
    const amount = parseFloat(document.getElementById(`amount${pcNumber}`).value);

    if (!name || isNaN(amount) || amount <= 0) {
      alert("Please enter a valid name and amount.");
      return;
    }

    let totalSeconds = amount * 4 * 60; 
    const endTime = new Date(Date.now() + totalSeconds * 1000);

    savedData[pcNumber] = { name, amount, endTime };

    document.getElementById(`displayName${pcNumber}`).textContent = name;
    document.getElementById(`displayAmount${pcNumber}`).textContent = amount.toFixed(2);
    document.getElementById(`endTime${pcNumber}`).textContent = endTime.toLocaleTimeString();

    timers[pcNumber] = setInterval(() => {
      let remaining = Math.floor((endTime - new Date()) / 1000);

      if (remaining <= 0) {
        clearInterval(timers[pcNumber]);
        document.getElementById(`timeRemaining${pcNumber}`).textContent = "00:00";
        alert(`Time is up for ${name} (PC ${pcNumber})!`);
        return;
      }

      let minutes = Math.floor(remaining / 60);
      let seconds = remaining % 60;
      document.getElementById(`timeRemaining${pcNumber}`).textContent =
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }, 1000);
  }

  function stopTimer(pcNumber) {
    clearInterval(timers[pcNumber]);
  }

  function restartTimer(pcNumber) {
    if (!savedData[pcNumber]) {
      alert("No previous session found for this PC.");
      return;
    }
    const { name, amount } = savedData[pcNumber];
    document.getElementById(`name${pcNumber}`).value = name;
    document.getElementById(`amount${pcNumber}`).value = amount;
    startTimer(pcNumber);
  }

  function addTime(pcNumber) {
    if (!savedData[pcNumber]) {
      alert("No active session to extend.");
      return;
    }

    const addAmount = parseFloat(prompt("Enter additional payment (₱):"));
    if (isNaN(addAmount) || addAmount <= 0) {
      alert("Invalid amount.");
      return;
    }

    // Add time: 1 peso = 4 minutes
    const addedSeconds = addAmount * 4 * 60;
    savedData[pcNumber].amount += addAmount;
    savedData[pcNumber].endTime = new Date(savedData[pcNumber].endTime.getTime() + addedSeconds * 1000);

    document.getElementById(`displayAmount${pcNumber}`).textContent = savedData[pcNumber].amount.toFixed(2);
    document.getElementById(`endTime${pcNumber}`).textContent = savedData[pcNumber].endTime.toLocaleTimeString();

    alert(`Added ₱${addAmount.toFixed(2)} (extra ${(addedSeconds/60).toFixed(0)} mins) for PC ${pcNumber}.`);
  }
</script>

</body>
</html>
