<script>
const pcCount = 4;
let totalEarnings = 0;
const timers = {}, remainingSeconds = {}, endTimes = {}, logs = JSON.parse(localStorage.getItem("sessionLogs")||"[]");
const alertSound = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");

function createPCBoxes() {
  const container = document.getElementById("pcs");
  for (let i = 1; i <= pcCount; i++) {
    container.innerHTML += `
    <div class="pc-box" id="pc${i}">
      <h2>💻 PC ${i}</h2>
      <input type="text" id="name${i}" placeholder="Customer Name">
      <input type="number" id="amount${i}" placeholder="Amount (₱)" min="1">
      <div>
        <button onclick="startTimer(${i})">Start</button>
        <button class="stop-btn" onclick="stopTimer(${i})">Stop</button>
        <button class="restart-btn" onclick="restartTimer(${i})">Restart</button>
      </div>
      <input type="number" id="addAmount${i}" placeholder="Add ₱ (extra time)" min="1">
      <button class="addtime-btn" onclick="addTime(${i})">➕ Add Time</button>

      <div class="info">
        <p><b>Name:</b> <span id="displayName${i}">-</span></p>
        <p><b>Total Amount:</b> ₱<span id="displayAmount${i}">0</span></p>
        <p><b>Time Remaining:</b></p>
        <div class="timer" id="timeRemaining${i}">00:00</div>
        <div class="timer-bar"><div class="timer-fill" id="fill${i}"></div></div>
        <p>🕒 <small>Current: <span id="currentTime${i}">--:--:--</span></small></p>
        <p>⏰ <small>End: <span id="endTime${i}">--:--:--</span></small></p>
      </div>
    </div>`;
  }
}
createPCBoxes();

function getRate() {
  return Number(document.getElementById("rateInput").value) || 25;
}

setInterval(() => {
  const now = new Date().toLocaleTimeString();
  document.getElementById("dashboardTime").textContent = now;
  for (let i = 1; i <= pcCount; i++)
    document.getElementById(`currentTime${i}`).textContent = now;
  updateDashboard();
}, 1000);

function startTimer(pc) {
  stopTimer(pc);
  const name = document.getElementById(`name${pc}`).value.trim();
  const amt = parseFloat(document.getElementById(`amount${pc}`).value);
  if (!name || isNaN(amt) || amt <= 0) return alert("Enter valid name & amount");

  const minutes = amt * (getRate() / 5);
  const totalSeconds = minutes * 60;
  const endTime = new Date(Date.now() + totalSeconds * 1000);

  remainingSeconds[pc] = totalSeconds;
  endTimes[pc] = endTime.getTime();

  document.getElementById(`displayName${pc}`).textContent = name;
  document.getElementById(`displayAmount${pc}`).textContent = amt.toFixed(2);
  document.getElementById(`endTime${pc}`).textContent = endTime.toLocaleTimeString();
  totalEarnings += amt;
  runTimer(pc);
  saveData();
}

function runTimer(pc) {
  clearInterval(timers[pc]);
  timers[pc] = setInterval(() => {
    const now = Date.now();
    const remaining = Math.floor((endTimes[pc] - now) / 1000);
    remainingSeconds[pc] = remaining;

    if (remaining <= 0) {
      clearInterval(timers[pc]);
      document.getElementById(`timeRemaining${pc}`).textContent = "00:00";
      document.getElementById(`fill${pc}`).style.width = "0%";
      alertSound.play();
      notifyUser(`PC ${pc}: Time is up!`);
      logs.push({
        pc,
        name: document.getElementById(`displayName${pc}`).textContent,
        amount: document.getElementById(`displayAmount${pc}`).textContent,
        end: new Date().toLocaleTimeString()
      });
      saveData();
      return;
    }
    updateDisplay(pc);
  }, 1000);
}

function updateDisplay(pc) {
  let m = Math.floor(remainingSeconds[pc] / 60);
  let s = remainingSeconds[pc] % 60;
  document.getElementById(`timeRemaining${pc}`).textContent =
    `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

  const startAmt = parseFloat(document.getElementById(`displayAmount${pc}`).textContent);
  const total = startAmt * (getRate() / 5) * 60;
  document.getElementById(`fill${pc}`).style.width = `${(remainingSeconds[pc] / total) * 100}%`;
}

function addTime(pc) {
  const addAmt = parseFloat(document.getElementById(`addAmount${pc}`).value);
  if (isNaN(addAmt) || addAmt <= 0) return alert("Invalid additional amount");

  const extra = addAmt * (getRate() / 5) * 60;
  endTimes[pc] = (endTimes[pc] || Date.now()) + extra * 1000;
  remainingSeconds[pc] = Math.floor((endTimes[pc] - Date.now()) / 1000);

  totalEarnings += addAmt;
  const newAmt = parseFloat(document.getElementById(`displayAmount${pc}`).textContent) + addAmt;
  document.getElementById(`displayAmount${pc}`).textContent = newAmt.toFixed(2);
  document.getElementById(`addAmount${pc}`).value = "";
  document.getElementById(`endTime${pc}`).textContent = new Date(endTimes[pc]).toLocaleTimeString();

  alert(`Added ₱${addAmt.toFixed(2)} to PC ${pc}`);
  saveData();
}

function stopTimer(pc) {
  clearInterval(timers[pc]);
  saveData();
}

function restartTimer(pc) {
  if (remainingSeconds[pc] > 0) runTimer(pc);
}

function updateDashboard() {
  let active = Object.values(remainingSeconds).filter(v => v > 0).length;
  document.getElementById("activePCs").textContent = active;
  document.getElementById("totalEarnings").textContent = "₱" + totalEarnings.toFixed(2);
}

function notifyUser(msg) {
  if (Notification.permission === "granted") {
    new Notification("PC Timer", { body: msg });
  }
}
Notification.requestPermission();

function saveData() {
  localStorage.setItem("pcRentalData", JSON.stringify({ endTimes, totalEarnings }));
  localStorage.setItem("sessionLogs", JSON.stringify(logs));
}

function loadData() {
  const data = JSON.parse(localStorage.getItem("pcRentalData") || "{}");
  if (data.endTimes) {
    Object.assign(endTimes, data.endTimes);
    totalEarnings = data.totalEarnings || 0;

    for (let i = 1; i <= pcCount; i++) {
      if (endTimes[i]) {
        const remaining = Math.floor((endTimes[i] - Date.now()) / 1000);
        if (remaining > 0) {
          remainingSeconds[i] = remaining;
          document.getElementById(`endTime${i}`).textContent = new Date(endTimes[i]).toLocaleTimeString();
          runTimer(i);
        }
      }
    }
  }
}

function resetAll() {
  if (!confirm("Reset all data?")) return;
  localStorage.clear();
  location.reload();
}

function exportLogs() {
  let csv = "PC,Name,Amount,EndTime\n";
  logs.forEach(l => csv += `${l.pc},${l.name},${l.amount},${l.end}\n`);
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pc_rental_logs.csv";
  a.click();
  URL.revokeObjectURL(url);
}

window.onload = loadData;
</script>
